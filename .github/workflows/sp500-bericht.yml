name: S&P-500-Tagesbericht

# GitHub Actions plant nur in UTC. Zwei Einträge decken Sommer- und Winterzeit ab;
# das Programm prüft anhand des geplanten Slots, welcher heute 14:00 Uhr Berlin entspricht.
# Hinweis: Zeitpläne laufen nur auf dem Standardbranch und können sich bei hoher Last verzögern.
on:
  schedule:
    - cron: "0 12 * * 1-5"   # 14:00 Uhr MESZ (Sommerzeit)
    - cron: "0 13 * * 1-5"   # 14:00 Uhr MEZ (Winterzeit)
  workflow_dispatch:
    inputs:
      zeitpunkt:
        description: "Nur Test: simulierter Zeitpunkt (ISO, z. B. 2026-10-23T14:00+02:00)"
        required: false

permissions:
  contents: read

concurrency:
  group: sp500-bericht
  cancel-in-progress: false

jobs:
  bericht:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: trading
    env:
      SPX_KAPITAL_EUR: ${{ secrets.SPX_KAPITAL_EUR }}
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
      FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
      ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
      ALPACA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASSWORT: ${{ secrets.SMTP_PASSWORT }}
      BERICHT_EMPFAENGER: ${{ secrets.BERICHT_EMPFAENGER }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: trading/requirements.txt
      - name: Abhängigkeiten
        run: pip install -r requirements.txt
      - name: Tests
        run: python -m pytest -q
      - name: Bericht erzeugen
        id: lauf
        env:
          CRON: ${{ github.event.schedule }}
          ZEITPUNKT: ${{ github.event.inputs.zeitpunkt }}
        run: python -m spx bericht ${CRON:+--cron "$CRON"} ${ZEITPUNKT:+--zeitpunkt "$ZEITPUNKT"}
      - name: Bericht anzeigen (nur private Repositories)
        if: steps.lauf.outputs.bericht != '' && github.event.repository.private
        run: cat "${{ steps.lauf.outputs.bericht }}" >> "$GITHUB_STEP_SUMMARY"
      - name: Bericht archivieren (nur private Repositories)
        if: steps.lauf.outputs.bericht != '' && github.event.repository.private
        uses: actions/upload-artifact@v4
        with:
          name: bericht-${{ github.run_id }}
          path: trading/berichte/
          retention-days: 30
      - name: Hinweis öffentliches Repository
        if: steps.lauf.outputs.bericht != '' && !github.event.repository.private
        run: echo "Öffentliches Repository – Berichtsinhalt wird weder angezeigt noch archiviert (nur E-Mail)." >> "$GITHUB_STEP_SUMMARY"
      - name: Bericht per E-Mail
        if: steps.lauf.outputs.bericht != '' && env.SMTP_HOST != ''
        run: python -m spx.versand "${{ steps.lauf.outputs.bericht }}"
