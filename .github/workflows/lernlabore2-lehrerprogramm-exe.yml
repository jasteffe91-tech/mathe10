# Baut das lokale Lehrerprogramm als Windows-EXE (ohne dass Lehrkräfte Python installieren müssen).
# Start: GitHub → Actions → „Lernlabore 2.0 – Lehrerprogramm (Windows-EXE)“ → „Run workflow“.
# Ergebnis: Download unter „Artifacts“ (EXE + SHA256-Prüfsumme).
name: "Lernlabore 2.0 – Lehrerprogramm (Windows-EXE)"
on:
  workflow_dispatch:
  push:
    tags: ["lehrerprogramm-v*"]
permissions:
  contents: read
jobs:
  exe:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: lernlabore2/apps/local-teacher-tool
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt pyinstaller==6.16.0 pytest==9.2.0
      - name: Tests (ohne Oberfläche)
        run: python -m pytest -q tests/test_lehrerprogramm.py
      - run: pyinstaller --noconfirm --clean lernlabor-lehrerprogramm.spec
      - name: Prüfsumme
        shell: pwsh
        run: (Get-FileHash dist/Lernlabor-Lehrerprogramm.exe -Algorithm SHA256).Hash | Out-File -Encoding ascii dist/SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Lernlabor-Lehrerprogramm-Windows
          path: lernlabore2/apps/local-teacher-tool/dist/
          retention-days: 30
