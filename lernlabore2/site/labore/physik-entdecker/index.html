<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>Physik-Entdecker</title>
<meta name="description" content="Lernlabor für Klasse 4: Bewegung und Strom entdecken">
<link rel="stylesheet" href="styles.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%232f6fde'/%3E%3Ctext x='32' y='43' font-size='32' text-anchor='middle' fill='white' font-family='Arial'%3E%E2%98%85%3C/text%3E%3C/svg%3E">
</head>
<body>
<div id="app" class="app" data-bereich="start" aria-busy="true">
  <header class="kopf">
    <div class="marke">
      <svg viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="19" fill="var(--akzent)"/><path d="M12 27 L28 13" stroke="#fff" stroke-width="3" stroke-linecap="round"/><circle cx="13" cy="25" r="4" fill="#ffd43b"/><path d="M26 22 a5 5 0 1 0 0.1 0" fill="none" stroke="#fff" stroke-width="2.5"/></svg>
      <span>Physik-Entdecker</span>
    </div>
    <div id="sitzung" class="sitzung"></div>
  </header>
  <nav class="fortschritt" aria-label="Fortschritt">
    <ol id="schritte" class="schritte"></ol>
    <div id="balken" class="balken" role="progressbar" aria-label="Fortschritt" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div id="balken-fuellung" class="balken-fuellung"></div></div>
    <p id="fortschritt-text" class="fortschritt-text"></p>
  </nav>
  <main id="inhalt" class="inhalt" tabindex="-1">
    <section class="karte"><p class="gross-text">Lernlabor wird geladen …</p></section>
  </main>
  <footer class="fuss">
    <div id="speicherstatus"></div>
    <p class="klein">Keine Werbung, kein Tracking. Gespeichert wird nur dein Lernstand – ohne Namen.</p>
  </footer>
  <div id="ansage" class="vh" aria-live="polite"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</div>
<noscript><p style="padding:16px;font-size:20px">Bitte JavaScript aktivieren, damit das Lernlabor funktioniert.</p></noscript>
