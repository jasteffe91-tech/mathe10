<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Stadtfuchs</title>
<meta name="description" content="Stadtrallyes und Schnitzeljagden für jeden Anlass: JGA, Schulklasse, Kindergeburtstag, Kneipentour oder Tagesausflug – mit Quiz, Lösungswort, Foto-Aufgaben und Karte.">
<meta name="theme-color" content="#e8611a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Stadtfuchs">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,600..900&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@500;600&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
/* Stadtplan-Papier: kühles Kartengrün als Grund, Fuchsorange für alles, was man antippt,
   Stempel-Kreise für Stationen (wie auf einem Laufzettel). Schrift: breite Grotesk wie
   Wegweiser, darunter eine Lesehilfe-Schrift, die auch draußen in der Sonne gut lesbar ist. */
:root{
  --papier:#edf1ea; --flaeche:#ffffff; --flaeche2:#e2e8df; --linie:#cdd6c9;
  --tinte:#17232a; --leise:#56676d; --fuchs:#e05a14; --fuchs-tief:#b1440a; --fuchs-hell:#fde7d9;
  --park:#2c7651; --park-hell:#dcefe3; --wasser:#2a6c99; --falsch:#bf3b25; --falsch-hell:#f8e0da;
  --schatten:0 1px 2px rgba(23,35,42,.06),0 6px 18px rgba(23,35,42,.06);
  --f-schild:"Archivo","Arial Narrow",system-ui,sans-serif;
  --f-text:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-zahl:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --papier:#0e1418; --flaeche:#162026; --flaeche2:#1d2930; --linie:#2b3a42;
    --tinte:#e7eef0; --leise:#93a5ab; --fuchs:#ff7a33; --fuchs-tief:#ffa06b; --fuchs-hell:#3a2214;
    --park:#5cc48e; --park-hell:#173326; --wasser:#6fb4e3; --falsch:#ff8a72; --falsch-hell:#3b1d17;
    --schatten:0 1px 2px rgba(0,0,0,.3); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --papier:#0e1418; --flaeche:#162026; --flaeche2:#1d2930; --linie:#2b3a42;
  --tinte:#e7eef0; --leise:#93a5ab; --fuchs:#ff7a33; --fuchs-tief:#ffa06b; --fuchs-hell:#3a2214;
  --park:#5cc48e; --park-hell:#173326; --wasser:#6fb4e3; --falsch:#ff8a72; --falsch-hell:#3b1d17;
  --schatten:0 1px 2px rgba(0,0,0,.3); color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;background:var(--papier);color:var(--tinte);font-family:var(--f-text);font-size:17px;line-height:1.5;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--fuchs);outline-offset:2px}
img{max-width:100%}
.wrap{max-width:760px;margin:0 auto;padding-block:8px 72px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{margin:0;text-wrap:balance;font-family:var(--f-schild);font-stretch:112%;font-weight:800;letter-spacing:-.01em;line-height:1.15}
h1{font-size:clamp(1.9rem,7vw,2.6rem)}
h2{font-size:1.3rem}
h3{font-size:1.08rem}
p{margin:0}
.leise{color:var(--leise)}
.klein{font-size:.88rem}
.zahl{font-family:var(--f-zahl);font-variant-numeric:tabular-nums}
.etikett{font-family:var(--f-schild);font-stretch:118%;font-weight:700;font-size:.72rem;letter-spacing:.09em;text-transform:uppercase;color:var(--leise)}
.stapel{display:grid;gap:14px}
.zeile{display:flex;flex-wrap:wrap;gap:10px;align-items:center}

/* Kopf */
.kopf{display:flex;align-items:center;gap:10px;padding-block:10px 14px}
.marke{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--tinte);background:none;border:0;padding:0}
.marke svg{width:38px;height:38px;flex:none}
.marke b{font-family:var(--f-schild);font-stretch:125%;font-weight:900;font-size:1.35rem;letter-spacing:-.02em}
.kopf .rechts{margin-left:auto;display:flex;gap:8px}

/* Knöpfe */
.knopf{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:10px 18px;border-radius:12px;border:1px solid var(--linie);
  background:var(--flaeche);color:var(--tinte);font-weight:700;text-decoration:none;text-align:center}
.knopf:hover{border-color:var(--fuchs)}
.knopf.haupt{background:var(--fuchs);border-color:var(--fuchs);color:#fff}
.knopf.haupt:hover{background:var(--fuchs-tief);border-color:var(--fuchs-tief)}
:root[data-theme="dark"] .knopf.haupt{color:#1a0d05}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .knopf.haupt{color:#1a0d05}}
.knopf.breit{width:100%}
.knopf.klein{min-height:38px;padding:6px 12px;font-size:.9rem}
.knopf.still{background:transparent;border-color:transparent;color:var(--leise)}
.knopf[disabled]{opacity:.45;cursor:default}

.karte{background:var(--flaeche);border:1px solid var(--linie);border-radius:16px;padding:18px;box-shadow:var(--schatten)}

/* Startseite */
.held{display:grid;gap:12px;padding-block:18px 8px}
.held p{font-size:1.08rem;max-width:36em}
.held .unterzeile{font-family:var(--f-schild);font-stretch:120%;font-weight:700;color:var(--fuchs-tief);font-size:.95rem;letter-spacing:.02em}
.staedte{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.stadt{display:grid;gap:6px;text-align:left;background:var(--flaeche);border:1px solid var(--linie);border-radius:14px;padding:16px 16px 14px;color:var(--tinte);position:relative;overflow:hidden}
.stadt::before{content:"";position:absolute;inset:0 0 auto 0;height:5px;background:var(--park)}
.stadt:hover{border-color:var(--fuchs)}
.stadt:hover::before{background:var(--fuchs)}
.stadt b{font-family:var(--f-schild);font-stretch:118%;font-weight:800;font-size:1.25rem}
.stadt .zahl{font-size:.8rem;color:var(--leise)}
.weiter{display:grid;gap:10px;border-color:var(--fuchs);background:var(--fuchs-hell)}
.ablauf{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;counter-reset:schritt}
.ablauf div{display:grid;gap:4px;padding:14px;border-radius:12px;background:var(--flaeche2)}
.ablauf div::before{counter-increment:schritt;content:counter(schritt);font-family:var(--f-zahl);font-weight:600;color:var(--fuchs-tief)}

/* Planer */
.schritt{display:grid;gap:10px}
.schritt>header{display:flex;align-items:baseline;gap:10px}
.schritt>header .nr{font-family:var(--f-zahl);font-weight:600;color:var(--fuchs-tief)}
.chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px}
.chip{display:grid;grid-template-columns:1fr;gap:3px;align-content:start;text-align:left;padding:10px 12px;border-radius:12px;border:1.5px solid var(--linie);background:var(--flaeche);color:var(--tinte)}
.chip .ic{font-size:1.3rem;line-height:1.2}
.chip>*{min-width:0}
.chip b{font-weight:700;line-height:1.25;hyphens:manual;overflow-wrap:break-word}
.chip small{color:var(--leise);font-size:.8rem;line-height:1.3}
.chip[aria-pressed="true"]{border-color:var(--fuchs);background:var(--fuchs-hell);box-shadow:inset 0 0 0 1px var(--fuchs)}
.chip[disabled]{opacity:.4;cursor:not-allowed}
.chip .anzahl{font-family:var(--f-zahl);font-size:.72rem;color:var(--leise)}
.feld{display:grid;gap:6px}
.feld label{font-weight:700;font-size:.92rem}
.feld input,.feld select,.feld textarea{width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--linie);background:var(--flaeche);min-height:46px}
.schalter{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.schalter input{width:22px;height:22px;accent-color:var(--fuchs);flex:none;margin-top:2px}
.segment{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.segment button{padding:10px 8px;border-radius:10px;border:1.5px solid var(--linie);background:var(--flaeche);display:grid;gap:2px}
.segment button small{color:var(--leise);font-size:.78rem}
.segment button[aria-pressed="true"]{border-color:var(--fuchs);background:var(--fuchs-hell)}

/* Vorschau & Karte */
.kartenbox{height:300px;border-radius:14px;overflow:hidden;border:1px solid var(--linie);background:var(--flaeche2)}
.kartenbox.klein{height:220px}
.kennzahlen{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kennzahlen div{display:grid;gap:2px;padding:10px 12px;border-radius:12px;background:var(--flaeche2)}
.kennzahlen b{font-family:var(--f-zahl);font-size:1.15rem}
.route{list-style:none;margin:0;padding:0;display:grid}
.route li{display:grid;grid-template-columns:40px 1fr;gap:10px;align-items:start;padding-block:9px;border-bottom:1px dashed var(--linie)}
.route li:last-child{border-bottom:0}
.route .etappe{font-family:var(--f-zahl);font-size:.78rem;color:var(--leise)}
.route .min-w0{min-width:0}
.marke-oepnv{display:inline-block;margin-left:6px;padding:1px 7px;border-radius:99px;background:var(--flaeche2);font-size:.72rem;color:var(--wasser);font-weight:700}

/* Stempel: Stationsnummer wie ein Laufzettel-Stempel */
.stempel{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-zahl);font-weight:600;font-size:.9rem;
  border:2px solid var(--fuchs);color:var(--fuchs-tief);background:var(--flaeche);box-shadow:inset 0 0 0 3px var(--flaeche),inset 0 0 0 4px var(--fuchs)}
.stempel.fertig{background:var(--park);border-color:var(--park);color:#fff;box-shadow:inset 0 0 0 3px var(--park),inset 0 0 0 4px rgba(255,255,255,.6)}
.stempel.jetzt{background:var(--fuchs);color:#fff;box-shadow:inset 0 0 0 3px var(--fuchs),inset 0 0 0 4px rgba(255,255,255,.7)}
.stempelreihe{display:flex;gap:6px;flex-wrap:wrap}
.stempelreihe .stempel{width:30px;height:30px;font-size:.78rem}
.stempelreihe button{padding:0;border:0;background:none;border-radius:50%}

/* Spiel */
.leiste{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--papier);padding-block:8px;display:grid;gap:8px;border-bottom:1px solid var(--linie);margin-bottom:12px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--papier)}
.leiste .oben{display:flex;align-items:center;gap:10px;justify-content:space-between}
.leiste .punkte{font-family:var(--f-zahl);font-weight:600}
.wegweiser{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center;padding:14px;border-radius:14px;background:var(--flaeche2)}
.pfeil{width:58px;height:58px;border-radius:50%;background:var(--flaeche);border:2px solid var(--linie);display:grid;place-items:center}
.pfeil svg{width:30px;height:30px;transition:transform .4s}
.wegweiser b{font-family:var(--f-zahl);font-size:1.3rem}
.station-kopf{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center}
.infotext{font-size:1.04rem;max-width:62ch}
.fakt{padding:12px 14px;border-radius:12px;background:var(--park-hell);border-left:4px solid var(--park)}
.hinweis{padding:10px 12px;border-radius:10px;background:var(--flaeche2);font-size:.88rem;color:var(--leise)}
.aufgabe{display:grid;gap:12px;padding:16px;border-radius:14px;border:1.5px solid var(--linie);background:var(--flaeche)}
.aufgabe.erledigt{border-color:var(--park)}
.aufgabe .typ{display:flex;justify-content:space-between;gap:8px}
.optionen{display:grid;gap:8px}
.option{display:grid;grid-template-columns:30px 1fr;gap:10px;align-items:center;text-align:left;padding:12px;border-radius:12px;border:1.5px solid var(--linie);background:var(--flaeche);min-height:52px}
.option .bst{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;background:var(--flaeche2);font-family:var(--f-zahl);font-weight:600}
.option[aria-pressed="true"]{border-color:var(--fuchs);background:var(--fuchs-hell)}
.option.richtig{border-color:var(--park);background:var(--park-hell)}
.option.falsch{border-color:var(--falsch);background:var(--falsch-hell)}
.ergebnis{font-weight:700}
.ergebnis.gut{color:var(--park)}
.ergebnis.schlecht{color:var(--falsch)}
.fotovorschau{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}
.fotovorschau img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;display:block}
.dateiknopf{position:relative;overflow:hidden}
.dateiknopf input{position:absolute;inset:0;opacity:0;cursor:pointer}

/* Lösungswort */
.wort{display:flex;flex-wrap:wrap;gap:6px}
.wort span{width:40px;height:48px;border-radius:8px;display:grid;place-items:center;font-family:var(--f-zahl);font-weight:600;font-size:1.3rem;
  background:var(--flaeche);border:2px dashed var(--linie)}
.wort span.voll{border-style:solid;border-color:var(--fuchs);color:var(--fuchs-tief)}

.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--tinte);color:var(--papier);padding:10px 16px;border-radius:12px;font-weight:700;z-index:50;max-width:calc(100% - 32px)}
.qr{display:grid;place-items:center;padding:12px;background:#fff;border-radius:12px;width:max-content;max-width:100%}
.qr svg{width:200px;height:200px}
details.mehr summary{cursor:pointer;font-weight:700}
.fuss{margin-top:32px;padding-top:16px;border-top:1px solid var(--linie);display:grid;gap:6px}
.leaflet-container{font-family:var(--f-text)}
.pin{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--fuchs);color:#fff;font:600 12px/1 var(--f-zahl);border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.35)}
.pin.fertig{background:var(--park)}
.pin.ich{background:var(--wasser);width:18px;height:18px}

/* Druckansicht: Laufzettel, Lösungsblatt, Urkunde */
#druck{display:none}
@media print{
  @page{margin:14mm}
  body{background:#fff;color:#000;font-size:11pt;padding:0}
  body::before{display:none}
  #app,.toast{display:none!important}
  #druck{display:block}
  .d-seite{break-after:page}
  .d-station{break-inside:avoid;border:1px solid #999;border-radius:6px;padding:8px 10px;margin:0 0 8px}
  .d-station h3{font-size:12pt;margin-bottom:4px}
  .d-linie{border-bottom:1px solid #999;height:22px}
  .d-wort{display:flex;gap:4px;margin-top:6px}.d-wort span{width:24px;height:28px;border:1px solid #000;display:inline-block}
  .urkunde{border:6px double #000;padding:40px;text-align:center;min-height:240mm;display:flex;flex-direction:column;justify-content:center;gap:18px}
  .urkunde h1{font-size:34pt}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="app" class="wrap" aria-live="polite"></div>
<div id="druck"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="app.js"></script>
</body>
</html>
