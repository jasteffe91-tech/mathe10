<!doctype html>
<html lang="de">
<head>

<!-- Mathe-Themenlabor Jahrgang 10 (Forderlabor) · Version 1.0 vom 16.11.2026 -->
<title>Mathe-Themenlabor 10 – von der 10 in die Oberstufe</title>
<style>
:root{--tinte:#16202A;--grau:#5E6B75;--hell:#F4F6F9;--rand:#DCE3EA;--weiss:#fff;--akz:#1565C0;--gruen:#2E7D32;--rot:#C62828;--gold:#B7791F;--lila:#6A3FA0;--gelb:#FFF7D6}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:"Segoe UI",system-ui,-apple-system,Arial,sans-serif;font-size:17px;line-height:1.5;color:var(--tinte);background:var(--hell)}
a{color:var(--akz)}
h1{font-size:1.9rem;line-height:1.2;margin:.2rem 0 .4rem}
h2{font-size:1.3rem;margin:1.4rem 0 .5rem}
h3{font-size:1.05rem;margin:.2rem 0 .4rem}
.kopf{position:sticky;top:0;z-index:20;background:var(--tinte);color:#fff}
.kopf-in{max-width:1080px;margin:0 auto;padding:.5rem 1rem;display:flex;gap:.8rem;align-items:center;flex-wrap:wrap}
.logo{font-weight:800;font-size:1.05rem;cursor:pointer;white-space:nowrap}
.logo span{color:#FFD166}
.kopf nav{display:flex;gap:.3rem;flex-wrap:wrap;flex:1}
.kopf nav a{color:#fff;text-decoration:none;padding:.25rem .6rem;border-radius:99px;font-size:.88rem;background:rgba(255,255,255,.1)}
.kopf nav a .nm{margin-left:.2rem}
.kopf nav a:hover,.kopf nav a.an{background:#fff;color:var(--tinte)}
.xp{font-size:.88rem;white-space:nowrap}
.xp b{color:#FFD166}
.xpbalken{height:5px;background:rgba(255,255,255,.15)}
.xpbalken div{height:100%;background:linear-gradient(90deg,#FFD166,#EF476F);width:0;transition:width .5s}
main{max-width:1080px;margin:0 auto;padding:1rem 1rem 4rem}
.held{background:linear-gradient(135deg,#16202A,#27408B 60%,#6A3FA0);color:#fff;border-radius:18px;padding:1.6rem 1.5rem;margin-bottom:1rem}
.held .ober{font-size:.78rem;letter-spacing:.12em;opacity:.8}
.held p{max-width:46rem;margin:.4rem 0}
.karte{background:var(--weiss);border:1px solid var(--rand);border-radius:14px;padding:1rem 1.1rem;margin:.8rem 0}
.kacheln{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:.8rem}
.kachel{background:#fff;border:1px solid var(--rand);border-radius:16px;padding:1rem;text-decoration:none;color:var(--tinte);display:flex;flex-direction:column;gap:.3rem;border-top:6px solid var(--f,#1565C0);transition:transform .15s,box-shadow .15s;position:relative}
.kachel:hover{transform:translateY(-3px);box-shadow:0 8px 20px rgba(22,32,42,.12)}
.kachel .ic{font-size:2rem}
.kachel b{font-size:1.1rem}
.kachel small{color:var(--grau)}
.ring{position:absolute;top:.8rem;right:.8rem;width:52px;height:52px}
.ring text{font-size:11px;font-weight:700;fill:var(--tinte)}
.balken{height:8px;background:var(--rand);border-radius:9px;overflow:hidden;margin-top:.3rem}
.balken div{height:100%;background:var(--f,var(--akz));border-radius:9px}
.gruppe{margin-top:1.2rem}
.gruppe>h2{display:flex;align-items:center;gap:.5rem}
.gruppe>p{color:var(--grau);margin:.1rem 0 .6rem;font-size:.95rem}
.modliste{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:.7rem}
.modkarte{background:#fff;border:1px solid var(--rand);border-left:6px solid var(--s,#1565C0);border-radius:12px;padding:.8rem .9rem;text-decoration:none;color:var(--tinte);display:block}
.modkarte:hover{box-shadow:0 6px 16px rgba(22,32,42,.1)}
.modkarte .meta{font-size:.82rem;color:var(--grau);display:flex;gap:.6rem;flex-wrap:wrap;margin-top:.2rem}
.modkarte.fertig{background:#F1F8F1}
.chip{display:inline-block;font-size:.75rem;font-weight:700;padding:.12rem .55rem;border-radius:99px;color:#fff;background:var(--s,#1565C0);white-space:nowrap}
.pfad{font-size:.88rem;color:var(--grau);margin-bottom:.4rem}
.pfad a{text-decoration:none}
.buch{background:#EEF4FF;border:1px solid #C9DAF8;border-radius:10px;padding:.5rem .8rem;font-size:.93rem;margin:.5rem 0}
.teil{background:#fff;border:1px solid var(--rand);border-radius:14px;padding:.9rem 1.1rem;margin:.8rem 0;position:relative}
.teil.ok{border-color:#9CCC9C;background:#F6FBF6}
.teil.info{background:#FFFDF2;border-color:#EAD98A}
.teil.bsp{background:#F3F0FA;border-color:#CFC3EA}
.teil .nr{float:right;font-size:.78rem;color:var(--grau)}
.teil details summary{cursor:pointer;font-weight:700}
.frage{margin:.1rem 0 .6rem}
.zeile{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap}
input[type=text],textarea{font:inherit;padding:.45rem .6rem;border:2px solid #B8C4CE;border-radius:9px;background:#fff;color:var(--tinte)}

textarea{width:100%;min-height:6.5rem;resize:vertical}

.knopf:hover{filter:brightness(1.1)}
.knopf.grau{background:#E3E8EE;color:var(--tinte)}

.knopf.klein{font-size:.85rem;padding:.3rem .65rem}
.rm{margin-top:.5rem;font-size:.95rem}
.rm.gut{color:var(--gruen);font-weight:700}
.rm.schlecht{color:var(--rot);font-weight:700}

.opt{display:grid;gap:.4rem}

.opt button.f{border-color:var(--rot);background:#FCECEC;text-decoration:line-through;opacity:.75}
.br{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;font-size:.92em;line-height:1.15;margin:0 .12em}

.merke{border-left:5px solid var(--gold);padding:.3rem .8rem;margin:.5rem 0;background:#FFF9E8;border-radius:0 8px 8px 0}
.schloss{text-align:center;color:var(--grau);padding:1.3rem;border:2px dashed #B8C4CE;border-radius:14px;margin:.8rem 0;background:#fff}

.escape .teil.ok{background:#1F3327;border-color:#4C9A63}

.escape .tipp{color:var(--tinte)}
.sieg{background:linear-gradient(135deg,#2E7D32,#1565C0);color:#fff;border-radius:16px;padding:1.2rem;text-align:center;font-size:1.15rem;margin:1rem 0}
.sim{border:1px solid var(--rand);border-radius:12px;padding:.6rem;background:#FAFBFD}
.sim svg{width:100%;max-width:640px;display:block;margin:0 auto;background:#fff;border-radius:8px}
.regler{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:.4rem 1rem;margin:.5rem 0}
.regler label{font-size:.92rem;display:block}
.regler input{width:100%}
.simtext{text-align:center;font-size:1.08rem;margin:.3rem 0}
.abz{display:flex;flex-wrap:wrap;gap:.5rem}
.abz span{background:#fff;border:1px solid var(--rand);border-radius:99px;padding:.25rem .7rem;font-size:.9rem}
.abz span.aus{opacity:.35;filter:grayscale(1)}
table.t{border-collapse:collapse;margin:.5rem 0;font-size:.95rem}
table.t th,table.t td{border:1px solid #B8C4CE;padding:.3rem .6rem;text-align:center}
table.t th{background:#EEF2F6}
table.b{width:100%;border-collapse:collapse;font-size:.92rem}
table.b th,table.b td{border-bottom:1px solid var(--rand);padding:.3rem .4rem;text-align:left}
.weiter{display:flex;justify-content:space-between;gap:.6rem;flex-wrap:wrap;margin-top:1.2rem}
.toast{position:fixed;left:50%;bottom:1.2rem;transform:translateX(-50%) translateY(140%);background:var(--tinte);color:#fff;padding:.6rem 1.1rem;border-radius:99px;font-weight:700;transition:transform .35s;z-index:50;box-shadow:0 6px 20px rgba(0,0,0,.3)}
.toast.an{transform:translateX(-50%) translateY(0)}
.klein{font-size:.88rem;color:var(--grau)}
#nojs{background:#C62828;color:#fff;padding:1rem;text-align:center}

@media print{.kopf,.weiter,.knopf,.toast,.keindruck{display:none!important}body{background:#fff;font-size:11pt}.karte{border:0;padding:0}main{padding:0}}

/* ---------- Fassung 2: Kapitel, Missionen, neue Aufgabenformen ---------- */
select{font:inherit;padding:.4rem .5rem;border:2px solid #B8C4CE;border-radius:9px;background:#fff;color:var(--tinte);max-width:100%}
input.r,select.r,textarea.r{border-color:var(--gruen);background:#F1F8F1}
input.f,select.f,textarea.f{border-color:var(--rot);background:#FDF0F0}

.heldzeile{display:flex;gap:.6rem;flex-wrap:wrap;margin-top:.8rem}
.heldzeile span{background:rgba(255,255,255,.14);border-radius:99px;padding:.25rem .8rem;font-size:.92rem;font-weight:600}
.kachel em{font-style:normal;font-weight:700;color:var(--f);font-size:.95rem}

.kapitel .kt{flex:1 1 320px}.kapitel .ober{font-size:.75rem;letter-spacing:.12em;opacity:.85}
.kapitel .stand{font-weight:700;margin-bottom:0}

.skala{display:flex;flex-wrap:wrap;gap:.3rem;align-items:center;justify-content:center}

.mkopf{display:flex;gap:.9rem;align-items:center;margin:.3rem 0 .6rem}

.meta{font-size:.85rem;color:var(--grau);display:flex;gap:.7rem;flex-wrap:wrap;align-items:center}
.sterne span{color:#CFD6DD;font-size:1.05em}.sterne span.an{color:#F5A623}
.modliste.kompakt{grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.modliste.kompakt .modkarte{padding:.5rem .7rem;font-size:.93rem}
.modkarte.gross{display:flex;gap:.8rem;align-items:flex-start;padding:1rem;border-left-width:8px;box-shadow:0 2px 8px rgba(22,32,42,.06)}
.modkarte.gross .mi{font-size:2.5rem;line-height:1}
.modkarte .mt{display:flex;flex-direction:column;gap:.2rem}

.modliste:not(.kompakt){grid-template-columns:repeat(auto-fill,minmax(330px,1fr))}
.ggra{display:grid;gap:.45rem;margin-top:.4rem}

.gz.r{border-left-color:var(--gruen)}.gz.f{border-left-color:var(--rot);background:#FDF5F5}

.gz textarea{min-height:0}
.tabwrap{overflow-x:auto}
table.ein input{width:5.2em;max-width:100%;text-align:center;padding:.3rem}
table.ein th:first-child{text-align:left;background:#EEF2F6}
.zuord{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:.6rem}
.zz{border:1px solid var(--rand);border-radius:12px;padding:.6rem;display:flex;flex-direction:column;gap:.4rem;align-items:center;text-align:center;background:#FAFBFD}
.zz.r{border-color:var(--gruen);background:#F1F8F1}.zz.f{border-color:var(--rot);background:#FDF0F0}
.zz .zl{font-weight:600}.zz svg{max-width:210px}
.luecke{line-height:2.5}
.luecke select,.luecke input{padding:.2rem .35rem;margin:0 .15rem}
ol.reihe{list-style:none;padding:0;margin:.4rem 0;counter-reset:r;display:grid;gap:.35rem}

ol.reihe li>span:first-child::before{content:counter(r) ". ";font-weight:800;color:var(--grau)}
ol.reihe.f li{border-color:#E7A6A6}.rk{display:flex;gap:.25rem;flex:0 0 auto}
.rechnung button{font-variant-numeric:tabular-nums}
.zn{display:inline-block;min-width:1.6rem;font-weight:800;color:var(--grau)}
.sieg .gross{font-size:2.2rem;margin:.2rem 0}.sieg .sterne span{color:rgba(255,255,255,.35)}.sieg .sterne span.an{color:#FFD54F}
.skarte{display:flex;gap:.8rem;align-items:center;text-align:left;background:rgba(255,255,255,.14);border-radius:14px;padding:.7rem .9rem;margin-top:.8rem;font-size:.95rem}
.skarte .ic{font-size:2.6rem}
.kartengal{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:.8rem}

.sk.an{border:2px solid #F5A623;color:var(--tinte);background:linear-gradient(180deg,#FFFDF5,#fff)}
.sk .ic{font-size:2.6rem}.sk p{margin:.3rem 0 0;font-size:.9rem}.sk small{color:var(--grau)}
.t-ggra,.t-tab,.t-zuord,.t-reihe,.t-klick,.t-luecke,.t-fehler{border-left:6px solid #B8C4CE}
.teil.ok{border-left-color:#66BB6A}
.rm ul{margin:.3rem 0 0 1.1rem;padding:0;font-weight:400}
.escape .gz>label{color:#C9D1E0}.escape select,.escape input[type=text],.escape textarea{color:var(--tinte)}
@media (max-width:600px){.gz{grid-template-columns:1fr;gap:.15rem}.gz>label{padding-top:0}.kapitel .ks{font-size:2.8rem}.mkopf .mi{font-size:2.2rem}}

  <div class="kopf-in">
    <div class="logo" id="logo">∑ Themenlabor <span>10+</span></div>

<main id="app"></main>

<script>
/* =====================================================================
   MATHE-THEMENLABOR 10+ · Bausteine für den Inhalt (v1, 16.11.2026)
   Jede Themen-Datei (t1_….js) hängt ein Thema an THEMEN an.
   Schlüssel (k) eines Aufgabenteils nie umbenennen – sonst gehen
   gespeicherte Antworten verloren.

   Schreibweise in Texten:  x^2  x^{-3}  x_1  {{Zähler|Nenner}}
   Bausteine:
     I(titel, html)             Wissen / Merksatz
     B(titel, html)             Beispiel (aufklappbar)
     Z(k, frage, soll, o)       Zahl          o: einh, nk (Nachkommastellen), tol, tipp, lsg
     ZM(k, frage, [soll…], o)   Lösungsmenge  ([] = keine Lösung)
     V(k, frage, [x, y, z], o)  Koordinaten in fester Reihenfolge (Punkt, Vektor)
     MC(k, frage, [richtig, falsch…], o)   richtige Antwort immer ZUERST
     T(k, frage, 'Term', o)     Term (wird durch Einsetzen verglichen)
     F(k, frage, muster, o)     Freitext mit Musterlösung + Selbsteinschätzung
     C(k, frage, 'Wort', o)     Codewort
   o darf auch nur ein Text sein → dann ist es die Lösungserklärung (lsg).
   Stufen der Module: 'b' Basis (10 E) · 'f' Fordern · 'x' Experte (Oberstufe)
                      'zp' Prüfung · 'esc' Escape-Room · 'mod' Modellieren
   ===================================================================== */
var THEMEN = [];
function _o(o) { return typeof o === 'string' ? { lsg: o } : (o || {}); }
function I(titel, html) { return { t: 'info', titel: titel, html: html }; }
function B(titel, html) { return { t: 'bsp', titel: titel, html: html }; }
function Z(k, f, soll, o) { return Object.assign({ t: 'zahl', k: k, f: f, soll: soll }, _o(o)); }
function ZM(k, f, soll, o) { return Object.assign({ t: 'menge', k: k, f: f, soll: soll }, _o(o)); }
function V(k, f, soll, o) { return Object.assign({ t: 'vek', k: k, f: f, soll: soll }, _o(o)); }
function MC(k, f, opt, o) { return Object.assign({ t: 'mc', k: k, f: f, opt: opt }, _o(o)); }
function T(k, f, soll, o) { return Object.assign({ t: 'term', k: k, f: f, soll: soll }, _o(o)); }
function F(k, f, muster, o) { return Object.assign({ t: 'frei', k: k, f: f, muster: muster }, _o(o)); }
function C(k, f, soll, o) { return Object.assign({ t: 'code', k: k, f: f, soll: soll }, _o(o)); }
/* ---------- Bausteine der Fassung 2 (Missionen) ----------
   ST(wer, name, html)            Erzählkasten (Auftraggeberin spricht)
   BI(svg, unterschrift)          Abbildung
   G(k, text, o)                  Sachaufgabe Gegeben–Gesucht–Rechnung–Antwort
                                  o: geg [Zahlen, die genannt werden müssen], ges [richtig, falsch …],
                                     ans [richtiger Ansatz, falsche …] (freiwillig), soll, nk, tol, einh,
                                     einhOpt [richtig, falsch …] (freiwillig), lsg, bild
   TAB(k, frage, kopf, zeilen, o) Tabelle ausfüllen; Eingabezelle = { s: Sollwert, nk, tol }
   ZU(k, frage, links, rechts, o) Zuordnen: links[i] gehört zu rechts[i]
   R(k, frage, schritte, o)       Schritte in die richtige Reihenfolge bringen (richtig herum angeben)
   FE(k, frage, zeilen, falsch, o) Fehler finden: Nummer (ab 0) der falschen Zeile
   L(k, text, o)                  Lückentext: [[richtig|falsch|falsch]] oder [[=Zahl]]
   K(k, frage, o)                 Punkte im Koordinatensystem setzen: o.x, o.y, o.ziel [[x,y] …], o.vor / o.zeig (Funktionen)
   SCH(k, frage, o)               Erst schätzen: o.von, o.bis, o.schritt, o.wahr, o.einh, o.auf */
function ST(wer, name, html) { return { t: 'story', wer: wer, name: name, html: html }; }
function BI(svg, unter) { return { t: 'bild', svg: svg, unter: unter }; }
function G(k, f, o) { return Object.assign({ t: 'ggra', k: k, f: f }, o); }
function TAB(k, f, kopf, zeilen, o) { return Object.assign({ t: 'tab', k: k, f: f, kopf: kopf, zeilen: zeilen }, _o(o)); }
function ZU(k, f, links, rechts, o) { return Object.assign({ t: 'zuord', k: k, f: f, links: links, rechts: rechts }, _o(o)); }
function R(k, f, schritte, o) { return Object.assign({ t: 'reihe', k: k, f: f, schritte: schritte }, _o(o)); }
