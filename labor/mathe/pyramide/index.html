<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pyramiden-Labor 3D</title>
<style>
/* Labor-Kern (CROSS-001) – Gestaltung aller Labor-Apps.
   Farben: Palette „Mathe 10 G-Kurs“ (01_PERSOENLICH/gestaltungsrichtlinien.md §4), für Text auf Weiß
   abgedunkelt bis Kontrast ≥ 4,5 : 1 (§2). Fachgrößen-Farben: Farbcode Dreifach Mathe 10 G
   (08_QUELLEN/Schulbuecher/Dreifach_Mathe_10_G/DARSTELLUNGSKONVENTIONEN.md §1). */
:root {
  --dunkel: #1F2A44;        /* Nachtblau: Kopf */
  --haupt: #23705A;         /* Grün #2E8B6F abgedunkelt (5,9 : 1) für Text und Knöpfe */
  --haupt-hell: #2E8B6F;
  --akzent: #E07B39;        /* Orange: nur Rahmen/Flächen, nie Text */
  --hell: #EEF2F8;
  --text: #111827;
  --neben: #374151;
  --linie: #9AA8BF;         /* kräftiger Rahmen statt blasser Fläche (Beamer) */
  --fehler: #B3261E;
  /* Fachgrößen (Buchfarben) */
  --f-hk: #C62828;          /* Körperhöhe h_K: rot */
  --f-ha: #7B3FA0;          /* Seitenhöhen h_a, h_b: lila */
  --f-s: #23705A;           /* Seitenkante s: grün (im Buch für die Pyramide nicht festgelegt) */
  --f-g: #1F5FAD;           /* Grundfläche und Strecken darin (a/2, b/2, d/2): blau */
  --f-m: #9A4A12;           /* Mantel/Seitenflächen: orange (abgedunkelt für Text) */
  --schrift: "Avenir Next", "Helvetica Neue", Arial, sans-serif;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; font: 18px/1.45 var(--schrift); color: var(--text); background: #fff; }
button, input, select { font: inherit; color: inherit; }
sub, sup { font-size: 0.72em; line-height: 0; }

/* ---------- ohne JavaScript / Fehler ---------- */
.ohne-js { margin: 24px 16px; padding: 16px 18px; border: 3px solid var(--akzent); border-radius: 10px;
  background: #FFF4E8; font-size: 20px; }
.fehlerbox { position: fixed; left: 12px; right: 12px; bottom: 12px; z-index: 50; padding: 12px 16px;
  border: 3px solid var(--fehler); border-radius: 10px; background: #fff; color: var(--fehler); font-weight: 600; }
.hinweis-fehler { padding: 10px 12px; border: 2px solid var(--fehler); border-radius: 8px; color: var(--fehler); font-weight: 600; }

/* ---------- Seitengerüst ---------- */
.kopf { background: var(--dunkel); color: #fff; padding: 12px 16px; display: flex; flex-wrap: wrap;
  align-items: center; gap: 8px 16px; }
.kopf-text { flex: 1 1 260px; }
.kopf h1 { margin: 0; font-size: 26px; line-height: 1.2; }
.kopf .frage { margin: 2px 0 0; font-size: 19px; }
.kopf .ziel { margin: 2px 0 0; font-size: 16px; opacity: 0.92; }
.kopf .knopf { border-color: #fff; color: #fff; background: transparent; }
.kopf .knopf[aria-pressed="true"] { background: #fff; color: var(--dunkel); }

.lab { display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; padding: 12px 16px; max-width: 1280px; margin: 0 auto; }
.buehne-feld { position: sticky; top: 0; z-index: 5; align-self: start; background: #fff; padding-top: 4px; }
.buehne { position: relative; height: min(88vw, 46vh); min-height: 260px; border: 2px solid var(--linie);
  border-radius: 10px; background: #fff; overflow: hidden; touch-action: none; cursor: grab; outline: none; }
.buehne:active { cursor: grabbing; }
.buehne:focus-visible { box-shadow: 0 0 0 3px var(--akzent); }
.buehne svg { display: block; width: 100%; height: 100%; touch-action: none; user-select: none; -webkit-user-select: none; }
.buehne-info { margin: 4px 2px 0; font-size: 16px; color: var(--neben); }
.steuer { min-width: 0; }
.unten { max-width: 1280px; margin: 0 auto; padding: 0 16px 24px; }
@media (min-width: 900px) {
  .lab { grid-template-columns: minmax(0, 1.35fr) minmax(320px, 1fr); align-items: start; }
  .buehne-feld { top: 8px; }
  .buehne { height: min(72vh, 640px); }
}

/* ---------- Karten, Knöpfe, Regler ---------- */
.karte { border: 2px solid var(--linie); border-radius: 10px; padding: 10px 14px 12px; margin: 0 0 12px; background: #fff; }
.karte > h2, .karte > summary { margin: 0 0 6px; font-size: 19px; font-weight: 700; }
.karte p { margin: 4px 0; }
.klein { font-size: 16px; color: var(--neben); }
.knopfreihe { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0; }
.knopfreihe-titel { font-size: 16px; color: var(--neben); margin: 6px 0 0; }
.knopf { min-height: 44px; padding: 6px 14px; border: 2px solid var(--haupt); border-radius: 8px; background: #fff;
  color: var(--haupt); font-weight: 600; cursor: pointer; }
.knopf[aria-pressed="true"] { background: var(--haupt); color: #fff; }
.knopf:focus-visible, .schritt:focus-visible, input:focus-visible, select:focus-visible, summary:focus-visible {
  outline: 3px solid var(--akzent); outline-offset: 2px; }
.knopf:disabled { opacity: 0.45; cursor: default; }
.regler { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 0 10px; margin: 8px 0 4px; }
.regler label { font-weight: 600; }
.regler output { font-variant-numeric: tabular-nums; font-weight: 700; min-width: 4.5em; text-align: right; }
.regler-zeile { grid-column: 1 / -1; display: flex; align-items: center; gap: 8px; }
.regler input[type="range"] { flex: 1; min-width: 0; height: 36px; margin: 0; accent-color: var(--haupt); }
.schritt { width: 44px; height: 44px; flex: none; border: 2px solid var(--haupt); border-radius: 8px; background: #fff;
  color: var(--haupt); font-size: 22px; font-weight: 700; line-height: 1; cursor: pointer; }
.regler.aus { opacity: 0.5; }
.schalter { display: flex; align-items: center; gap: 10px; min-height: 40px; margin: 2px 0; cursor: pointer; }
.schalter input { width: 22px; height: 22px; margin: 0; accent-color: var(--haupt); flex: none; }
.auswahl { display: flex; align-items: center; gap: 10px; margin: 6px 0; }
.auswahl select { min-height: 40px; padding: 4px 8px; border: 2px solid var(--haupt); border-radius: 8px; background: #fff; }

/* ---------- Annahmen-Kasten ---------- */
.annahmen { border-color: var(--haupt-hell); background: #F5F9F7; }
.annahmen summary { cursor: pointer; }
.annahmen ul { margin: 6px 0 0; padding-left: 22px; }

/* ---------- Tafel, Gleichungen ---------- */
.tafel { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
.tafel th, .tafel td { padding: 5px 6px; border-bottom: 1px solid #C9D3E3; text-align: left; vertical-align: top; }
.tafel th { font-weight: 700; width: 5.5em; }
.tafel td.wert { font-weight: 600; }
.tafel tr.rw td { padding-top: 0; font-size: 16px; color: var(--neben); }
.gleichung { margin: 6px 0 0; }
.gleichung .zeile { padding: 3px 0; font-size: 19px; line-height: 1.6; }
.gleichung .zeile.vor { font-size: 16px; color: var(--neben); }
.gleichung .zeile.ergebnis { font-weight: 700; }
.gleichung .rand { color: var(--neben); margin-left: 16px; white-space: nowrap; }
.bruch { display: inline-flex; flex-direction: column; align-items: center; vertical-align: middle; font-size: 0.82em;
  line-height: 1.05; margin: 0 1px; }
.bruch > span:first-child { border-bottom: 1.5px solid currentColor; padding: 0 2px; }
.wz { white-space: nowrap; }
.wz .rad { border-top: 1.5px solid currentColor; padding: 0 2px; }
.c-hk { color: var(--f-hk); font-weight: 700; }
.c-ha { color: var(--f-ha); font-weight: 700; }
.c-s  { color: var(--f-s); font-weight: 700; }
.c-g  { color: var(--f-g); font-weight: 700; }
.c-m  { color: var(--f-m); font-weight: 700; }

/* ---------- Aufgaben ---------- */
.aufgaben { list-style: none; margin: 0; padding: 0; }
.aufgaben li { display: flex; gap: 10px; padding: 8px 0; border-bottom: 1px solid #C9D3E3; }
.niveau { flex: none; display: inline-flex; align-items: center; justify-content: center; width: 34px; height: 34px;
  border-radius: 6px; font-size: 20px; font-weight: 700; color: #111827; }
.niveau.n1 { background: #FFD84D; }   /* ▽ gelb  */
.niveau.n2 { background: #F4A259; }   /* ◪ orange */
.niveau.n3 { background: #C9A3E0; }   /* ☒ lila  */
.aufgaben details { margin-top: 4px; font-size: 16px; color: var(--neben); }
.aufgaben summary { cursor: pointer; color: var(--haupt); font-weight: 600; }

/* ---------- Zeichnungen (SVG) ---------- */
.gitter line { stroke: #CBD5E3; stroke-width: 1; }
.fl-g { fill: #8FBDEB; fill-opacity: 0.75; }
.fl-m { fill: #F5B37E; fill-opacity: 0.3; }
.fl-d { fill: #FFD84D; fill-opacity: 0.72; }
.k { stroke: #111827; stroke-width: 2.2; fill: none; stroke-linecap: round; }
.k-d { stroke: #374151; stroke-width: 1.5; fill: none; }
.s-hk { stroke: var(--f-hk); stroke-width: 3.4; fill: none; stroke-linecap: round; }
.s-ha { stroke: var(--f-ha); stroke-width: 3.4; fill: none; stroke-linecap: round; }
.s-s  { stroke: var(--f-s); stroke-width: 3.6; fill: none; stroke-linecap: round; }
.s-g  { stroke: var(--f-g); stroke-width: 3.4; fill: none; stroke-linecap: round; }
.v { stroke-dasharray: 7 6; stroke-linecap: butt; }
.k.v { stroke-width: 1.6; stroke: #374151; }
.s-hk.v, .s-ha.v, .s-s.v, .s-g.v { stroke-dasharray: 10 5; }   /* farbige Strecken im Inneren: lange Striche */
.wi { fill: none; stroke-width: 1.8; }
.wi.s-hk, .wi.s-ha, .wi.s-g, .wi.s-s { stroke-width: 1.8; }
.pk { fill: #111827; }
.t { font-family: var(--schrift); font-weight: 700; fill: #111827; paint-order: stroke; stroke: #fff;
  stroke-width: 4px; stroke-linejoin: round; }
.t-hk { fill: var(--f-hk); }
.t-ha { fill: var(--f-ha); }
.t-s  { fill: var(--f-s); }
.t-g  { fill: var(--f-g); }
.t-m  { fill: var(--f-m); }
.bs { stroke-width: 1.6; }
.bs.t-hk { stroke: var(--f-hk); } .bs.t-ha { stroke: var(--f-ha); } .bs.t-s { stroke: var(--f-s); }
.bs.t-g { stroke: var(--f-g); } .bs.t { stroke: #111827; }
.flach { display: block; width: 100%; max-width: 460px; height: auto; margin: 4px auto 0; }

/* ---------- Beamer-Modus: große Schrift, dicke Linien, große Zeichenfläche ---------- */
body.beamer { font-size: 22px; }
body.beamer .kopf h1 { font-size: 34px; }
body.beamer .kopf .frage { font-size: 26px; }
body.beamer .kopf .ziel { font-size: 20px; }
body.beamer .klein, body.beamer .buehne-info, body.beamer .tafel tr.rw td, body.beamer .gleichung .zeile.vor { font-size: 19px; }
body.beamer .gleichung .zeile { font-size: 24px; }
body.beamer .lab { max-width: none; }
body.beamer .unten { max-width: none; }
@media (min-width: 900px) {
  body.beamer .lab { grid-template-columns: minmax(0, 2fr) minmax(360px, 1fr); }
  body.beamer .buehne { height: 80vh; }
}
body.beamer .k { stroke-width: 3.4; }
body.beamer .k.v { stroke-width: 2.4; }
body.beamer .k-d { stroke-width: 2.2; }
body.beamer .s-hk, body.beamer .s-ha, body.beamer .s-g { stroke-width: 5; }
body.beamer .s-s { stroke-width: 5.4; }
body.beamer .wi { stroke-width: 2.6; }
body.beamer .v { stroke-dasharray: 10 8; }
body.beamer .s-hk.v, body.beamer .s-ha.v, body.beamer .s-s.v, body.beamer .s-g.v { stroke-dasharray: 14 7; }
body.beamer .t { stroke-width: 5px; }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

@media (max-width: 699px) {          /* Handy: Kopf kompakt, Beamer-Knopf weg */
  .kopf { padding: 8px 16px; }
  .kopf h1 { font-size: 22px; }
  .kopf .frage { font-size: 18px; }
  .kopf .ziel, .kopf .knopf { display: none; }
  .knopf { padding: 6px 10px; font-size: 17px; }
  .knopfreihe { gap: 5px; }
  .karte { padding: 8px 10px 10px; }
}

</style>
</head>
<body>
<div id="ohne-js" class="ohne-js"><strong>Pyramiden-Labor 3D</strong><br>Bitte im Browser öffnen (Safari oder Chrome). Diese Seite braucht JavaScript – die Vorschau auf dem iPhone (z. B. aus „Dateien“ oder einer Mail) zeigt sie nicht richtig.</div>
<div id="app" hidden></div>
<script>
/* LAB – Labor-Kern (CROSS-001), erste Fassung für MATH-3D-001.
   Enthält: Zahlformat (deutsch, Komma, „≈“), Speicher (nur Komfort), Seitengerüst, Regler mit Label,
   Schalter, Knopfgruppe, Auswahl, Annahmen-Kasten, Beamer-Modus, Fehlermeldung, Hinweis ohne JavaScript.
   Zahlformat übernommen aus werkzeuge/lernseite_mathe10g/kern/ml_basis.js (ML.runde, ML.zahl, ML.ungefaehr).
   Beim Laden wird die Seite nicht angefasst – die Rechenteile laufen auch in den Tests (ohne Seite). */
var LAB = (function () {
  'use strict';

  /* ---------- Zahlen (aus ML übernommen) ---------- */
  // kaufmännisch runden; toPrecision(15) entfernt Gleitkomma-Rauschen (2,675 · 100 = 267,49999…)
  function runde(x, stellen) {
    if (!isFinite(x)) return x;
    var f = Math.pow(10, stellen), y = Number((Math.abs(x) * f).toPrecision(15));
    return (x < 0 ? -1 : 1) * Math.round(y) / f;
  }
  // deutsche Schreibweise: Komma, höchstens maxSt Nachkommastellen, Nullen am Ende weg, Tausender mit Leerzeichen
  function zahl(x, maxSt) {
    if (maxSt === undefined) maxSt = 2;
    if (!isFinite(x)) return '–';
    var r = runde(x, maxSt), neg = r < 0;
    var s = Math.abs(r).toFixed(maxSt).split('.');
    var ganz = s[0], dez = (s[1] || '').replace(/0+$/, '');
    if (ganz.length > 3) ganz = ganz.replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
    return (neg && r !== 0 ? '−' : '') + ganz + (dez ? ',' + dez : '');
  }
  function istGenau(x, st) { return Math.abs(x - runde(x, st)) < 1e-9; }
  function zeichen(x, st) { return istGenau(x, st) ? '=' : '≈'; }
  // genaue Werte ohne Nullen am Ende (5), gerundete mit fester Stellenzahl (6,40) – wie im Buch
  function wert(x, st) {
    if (st === undefined) st = 2;
    if (!isFinite(x) || istGenau(x, st)) return zahl(x, st);
    var t = zahl(x, st), k = t.indexOf(','), hat = k < 0 ? 0 : t.length - k - 1;
    return hat >= st ? t : t + (k < 0 ? ',' : '') + new Array(st - hat + 1).join('0');
  }
  function ungefaehr(x, st) { return zeichen(x, st) + ' ' + wert(x, st); }

  /* ---------- Speicher: nur Komfort, Seite läuft auch ohne ---------- */
  var speicher = {
    lies: function (k, std) {
      try { var w = window.localStorage.getItem('labor.' + k); return w === null ? std : JSON.parse(w); } catch (e) { return std; }
    },
    schreib: function (k, w) { try { window.localStorage.setItem('labor.' + k, JSON.stringify(w)); } catch (e) { /* egal */ } }
  };

  /* ---------- Seitenbausteine ---------- */
  var zaehler = 0;
  function neueId(p) { zaehler += 1; return (p || 'lab') + '-' + zaehler; }
  // el('div', {class: 'x', html: '…', onclick: f}, [kinder])
  function el(tag, attr, kinder) {
    var e = document.createElement(tag);
    Object.keys(attr || {}).forEach(function (k) {
      var w = attr[k];
      if (w === undefined || w === null || w === false) return;
      if (k === 'html') e.innerHTML = w;
      else if (k === 'text') e.textContent = w;
      else if (k.slice(0, 2) === 'on') e.addEventListener(k.slice(2), w);
      else e.setAttribute(k, w === true ? '' : w);
    });
    (kinder || []).forEach(function (c) { if (c) e.appendChild(typeof c === 'string' ? document.createTextNode(c) : c); });
    return e;
  }

  // Regler mit Label, Anzeige und −/+-Knöpfen. opt: label (HTML), name (für Vorlesen), min, max, schritt, wert,
  // anzeige(wert) → Text, beiAenderung(wert)
  function regler(opt) {
    var id = neueId('regler'), schritt = opt.schritt || 1;
    var anzeige = opt.anzeige || function (w) { return zahl(w, 2); };
    var input = el('input', { type: 'range', id: id, min: opt.min, max: opt.max, step: schritt, value: opt.wert });
    var out = el('output', { 'for': id });
    function zeige() {
      var t = anzeige(Number(input.value));
      out.textContent = t;
      input.setAttribute('aria-valuetext', t);
    }
    function setze(w, melden) {
      w = Math.min(opt.max, Math.max(opt.min, Math.round(w / schritt) * schritt));
      input.value = String(w); zeige();
      if (melden && opt.beiAenderung) opt.beiAenderung(Number(input.value));
    }
    input.addEventListener('input', function () { zeige(); if (opt.beiAenderung) opt.beiAenderung(Number(input.value)); });
    var minus = el('button', { type: 'button', 'class': 'schritt', 'aria-label': (opt.name || 'Wert') + ' verkleinern', text: '−',
      onclick: function () { setze(Number(input.value) - schritt, true); } });
    var plus = el('button', { type: 'button', 'class': 'schritt', 'aria-label': (opt.name || 'Wert') + ' vergrößern', text: '+',
      onclick: function () { setze(Number(input.value) + schritt, true); } });
    var box = el('div', { 'class': 'regler' }, [el('label', { 'for': id, html: opt.label }), out,
      el('div', { 'class': 'regler-zeile' }, [minus, input, plus])]);
    zeige();
    return {
      el: box, input: input,
      wert: function () { return Number(input.value); },
      setze: function (w) { setze(w, false); },
      aktiv: function (ja) { input.disabled = minus.disabled = plus.disabled = !ja; box.classList.toggle('aus', !ja); },
      neuAnzeigen: zeige
    };
  }

  function schalter(opt) {
    var id = neueId('schalter');
    var input = el('input', { type: 'checkbox', id: id, checked: !!opt.wert,
      onchange: function () { if (opt.beiAenderung) opt.beiAenderung(input.checked); } });
    var box = el('label', { 'class': 'schalter', 'for': id }, [input, el('span', { html: opt.label })]);
    return { el: box, input: input, wert: function () { return input.checked; }, setze: function (w) { input.checked = !!w; } };
  }

  // Knopfgruppe (eine Wahl aus mehreren). opt: titel, optionen [{wert, text (HTML), titel}], wert, beiAenderung
  function knopfgruppe(opt) {
    var aktuell = opt.wert, knoepfe = [];
    var reihe = el('div', { 'class': 'knopfreihe', role: 'group', 'aria-label': opt.titel || '' });
    opt.optionen.forEach(function (o) {
      var k = el('button', { type: 'button', 'class': 'knopf', html: o.text, title: o.titel,
        onclick: function () { setze(o.wert); if (opt.beiAenderung) opt.beiAenderung(o.wert); } });
      k.dataset.wert = o.wert; knoepfe.push(k); reihe.appendChild(k);
    });
    function setze(w) {
      aktuell = w;
      knoepfe.forEach(function (k) { k.setAttribute('aria-pressed', String(k.dataset.wert === String(w))); });
    }
    setze(aktuell);
    var box = el('div', {}, [opt.titel ? el('p', { 'class': 'knopfreihe-titel', html: opt.titel }) : null, reihe]);
    return {
      el: box, wert: function () { return aktuell; }, setze: setze,
      sichtbar: function (w, ja) { knoepfe.forEach(function (k) { if (k.dataset.wert === String(w)) k.hidden = !ja; }); }
    };
  }

  function auswahl(opt) {
    var id = neueId('auswahl');
    var s = el('select', { id: id, onchange: function () { if (opt.beiAenderung) opt.beiAenderung(s.value); } });
    opt.optionen.forEach(function (o) { s.appendChild(el('option', { value: o.wert, text: o.text, selected: o.wert === opt.wert })); });
    return { el: el('div', { 'class': 'auswahl' }, [el('label', { 'for': id, html: opt.label }), s]), wert: function () { return s.value; } };
  }

  function karte(titel, kinder, klasse) {
    return el('section', { 'class': 'karte' + (klasse ? ' ' + klasse : '') }, [titel ? el('h2', { html: titel }) : null].concat(kinder || []));
  }

  // Kasten „So ist das Modell gebaut“: Annahmen, Vereinfachungen, Grenzen
  function annahmen(titel, punkte) {
    return el('details', { 'class': 'karte annahmen' }, [el('summary', { html: titel || 'So ist das Modell gebaut' }),
      el('ul', {}, punkte.map(function (p) { return el('li', { html: p }); }))]);
  }

  // Beamer-Modus: große Schrift, dicke Linien, große Zeichenfläche. Zustand bleibt (localStorage, wenn möglich).
  function beamerKnopf(beiWechsel) {
    var an = speicher.lies('beamer', false);
    var k = el('button', { type: 'button', 'class': 'knopf', text: 'Beamer',
      title: 'Große Schrift und dicke Linien für den Beamer',
      onclick: function () { setze(!an); speicher.schreib('beamer', an); if (beiWechsel) beiWechsel(an); } });
    function setze(w) { an = !!w; document.body.classList.toggle('beamer', an); k.setAttribute('aria-pressed', String(an)); }
    setze(an);
    return k;
  }
  function istBeamer() { return typeof document !== 'undefined' && document.body.classList.contains('beamer'); }

  // Seitengerüst: Kopf (Titel, Frage, Ziel, Beamer-Knopf), zweispaltiger Hauptteil, unterer Teil
  function seite(opt) {
    var wurzel = document.getElementById('app');

    });

    return '<g font-size="' + f + '">' + out.join('') + '</g>';
  }

  /* ---------- Bedienung: Ziehen (Maus/Finger) und Pfeiltasten (5° je Druck) ---------- */
  function steuerung(element, beiDrehen) {
    var aktiv = null;
    element.addEventListener('pointerdown', function (e) {

    element.addEventListener('pointermove', function (e) {

      var dx = e.clientX - aktiv.x, dy = e.clientY - aktiv.y;
      aktiv.x = e.clientX; aktiv.y = e.clientY;
      if (dx || dy) beiDrehen(-dx * 0.5, dy * 0.5);
      e.preventDefault();
    });
    function ende(e) { if (aktiv && e.pointerId === aktiv.id) aktiv = null; }

    element.addEventListener('pointercancel', ende);
    element.addEventListener('keydown', function (e) {

<script>
/* PYR – Modell des Pyramiden-Labors (MATH-3D-001). Nur Rechnung, keine Seite → mit Referenzwerten testbar.
   Gerade Pyramide mit Rechteck-Grundfläche a × b (Quadrat: a = b) und Körperhöhe h_K (Spezifikation §6).
   Koordinaten: Grundfläche in der Ebene y = 0, Mittelpunkt im Ursprung, Spitze S(0 | h_K | 0).
   Die Kante a liegt parallel zur x-Achse (vorn bei z = b/2), die Kante b parallel zur z-Achse.
   Braucht R3D (kern/raum3d.js) für das Klappen um eine Kante. */
var PYR = (function () {
  'use strict';
  var BEREICH = { min: 1, max: 12, schritt: 0.5 };

  // Klartext statt NaN, wenn eine Eingabe nicht passt
  function pruefe(a, b, hK) {
    var w = [['Die Grundkante a', a], ['Die Grundkante b', b], ['Die Körperhöhe h_K', hK]];
    for (var i = 0; i < w.length; i++) {
      if (typeof w[i][1] !== 'number' || !isFinite(w[i][1])) return w[i][0] + ' ist keine Zahl.';
      if (w[i][1] <= 0) return w[i][0] + ' muss größer als 0 sein.';
    }
    return null;
  }

  // alle Größen; die Quadrate (ha2, …) werden mitgegeben, damit der Rechenweg ohne Rundungsfehler weiterrechnen kann
  function masse(a, b, hK) {
    var f = pruefe(a, b, hK);
    if (f) return { fehler: f };
    var d2 = a * a + b * b;
    var ha2 = hK * hK + (b / 2) * (b / 2);        // Seitenfläche über a: Abstand Mitte → Kante a ist b/2
    var hb2 = hK * hK + (a / 2) * (a / 2);        // Seitenfläche über b
    var s2 = hK * hK + d2 / 4;                    // = ha2 + (a/2)² = hb2 + (b/2)²
    var ha = Math.sqrt(ha2), hb = Math.sqrt(hb2), G = a * b, M = a * ha + b * hb;
    return { a: a, b: b, hK: hK, d: Math.sqrt(d2), d2: d2, ha: ha, hb: hb, s: Math.sqrt(s2), ha2: ha2, hb2: hb2, s2: s2,
      G: G, M: M, O: G + M, V: G * hK / 3, quadrat: a === b };
  }

  // A vorn links, B vorn rechts, C hinten rechts, D hinten links; F Höhenfußpunkt; Ma Mitte der vorderen Kante a; Mb Mitte der rechten Kante b
  function ecken(m) {
    var x = m.a / 2, z = m.b / 2;
    return { A: [-x, 0, z], B: [x, 0, z], C: [x, 0, -z], D: [-x, 0, -z], S: [0, m.hK, 0], F: [0, 0, 0], Ma: [0, 0, z], Mb: [x, 0, 0] };
  }

  function koerper(m) {
    var e = ecken(m);
    return {
      flaechen: [{ id: 'G', punkte: [e.A, e.B, e.C, e.D] }, { id: 'vorn', punkte: [e.A, e.B, e.S], ueber: 'a' },
        { id: 'rechts', punkte: [e.B, e.C, e.S], ueber: 'b' }, { id: 'hinten', punkte: [e.C, e.D, e.S], ueber: 'a' },
        { id: 'links', punkte: [e.D, e.A, e.S], ueber: 'b' }],
      kanten: [[e.A, e.B], [e.B, e.C], [e.C, e.D], [e.D, e.A], [e.A, e.S], [e.B, e.S], [e.C, e.S], [e.D, e.S]]
    };
  }

  // Sternnetz: jede Seitenfläche klappt um ihre Grundkante nach außen. t = 0 geschlossen … t = 1 flach (y = 0).
  // Klappwinkel = t · (180° − Neigungswinkel der Seitenfläche); starre Drehung → Kantenlängen bleiben gleich.
  function netz(m, t) {
    t = Math.min(1, Math.max(0, t));
    var e = ecken(m), flaechen = [{ id: 'G', punkte: [e.A, e.B, e.C, e.D] }];
    var kanten = [[e.A, e.B], [e.B, e.C], [e.C, e.D], [e.D, e.A]];
    // Achse in Umlaufrichtung A → B → C → D: positive Drehung bewegt die Spitze nach außen
    [[e.A, e.B, m.b / 2, 'vorn', 'a'], [e.B, e.C, m.a / 2, 'rechts', 'b'], [e.C, e.D, m.b / 2, 'hinten', 'a'],
      [e.D, e.A, m.a / 2, 'links', 'b']].forEach(function (k) {
      var neigung = Math.atan2(m.hK, k[2]);
      var S = R3D.dreheUmAchse(e.S, k[0], k[1], t * (Math.PI - neigung));
      flaechen.push({ id: k[3], punkte: [k[0], k[1], S], ueber: k[4] });
      kanten.push([k[0], S], [k[1], S]);
    });
    return { t: t, flaechen: flaechen, kanten: kanten };
  }

  // Stützdreiecke (Spezifikation §6): D1 h_K – a/2 bzw. b/2 – h_a · D2 h_K – d/2 – s · D3 h_a – a/2 – s.
  // seite 'a' = Seitenfläche über a (vorn), 'b' = über b (rechts; nur bei Rechteck verschieden).
  // Rückgabe: rechter Winkel bei „ecke“, Katheten k1 (ecke → p1) und k2 (ecke → p2), Hypotenuse hyp (p1 → p2).
  function stuetzdreieck(nr, seite, m) {
    var e = ecken(m), b = seite === 'b' && !m.quadrat;
    var hK = { name: 'h_K', wert: m.hK, q: m.hK * m.hK, klasse: 'hk' };
    var ha = { name: 'h_a', wert: m.ha, q: m.ha2, klasse: 'ha' }, hb = { name: 'h_b', wert: m.hb, q: m.hb2, klasse: 'ha' };
    var s = { name: 's', wert: m.s, q: m.s2, klasse: 's' };
    var a2 = { name: 'a/2', wert: m.a / 2, q: m.a * m.a / 4, klasse: 'g' }, b2 = { name: 'b/2', wert: m.b / 2, q: m.b * m.b / 4, klasse: 'g' };
    var d2 = { name: 'd/2', wert: m.d / 2, q: m.d2 / 4, klasse: 'g' };
    if (m.quadrat) b2 = { name: 'a/2', wert: m.b / 2, q: m.b * m.b / 4, klasse: 'g' };   // Quadrat: wie im Buch a/2
    var D;
    if (nr === 'D1') D = b ? { ecke: e.F, p1: e.S, p2: e.Mb, k1: hK, k2: a2, hyp: hb } : { ecke: e.F, p1: e.S, p2: e.Ma, k1: hK, k2: b2, hyp: ha };
    else if (nr === 'D2') D = { ecke: e.F, p1: e.S, p2: e.B, k1: hK, k2: d2, hyp: s };
    else if (nr === 'D3') D = b ? { ecke: e.Mb, p1: e.S, p2: e.B, k1: hb, k2: { name: 'b/2', wert: m.b / 2, q: m.b * m.b / 4, klasse: 'g' }, hyp: s }
      : { ecke: e.Ma, p1: e.S, p2: e.B, k1: ha, k2: a2, hyp: s };
    else return null;
    D.nr = nr; D.seite = b ? 'b' : 'a';
    return D;
  }

  // Flächeninhalte der Netzflächen (aus der Geometrie, nicht aus den Formeln) → Summe muss O sein
  function netzFlaechen(m, t) {
    return netz(m, t === undefined ? 1 : t).flaechen.map(function (f) { return { id: f.id, ueber: f.ueber, inhalt: R3D.flaecheninhalt(f.punkte) }; });
  }

  // alle Reglerwerte 1; 1,5; … ; 12
  function reglerWerte() {
    var w = [];
    for (var x = BEREICH.min; x <= BEREICH.max + 1e-9; x += BEREICH.schritt) w.push(Math.round(x * 2) / 2);
    return w;
  }

  return { BEREICH: BEREICH, pruefe: pruefe, masse: masse, ecken: ecken, koerper: koerper, netz: netz,
    stuetzdreieck: stuetzdreieck, netzFlaechen: netzFlaechen, reglerWerte: reglerWerte };
})();

  ui.netzRegler = LAB.regler({ label: 'Aufklappen', name: 'Aufklappen', min: 0, max: 100, schritt: 1, wert: 0,
    anzeige: function (w) { return w + ' %'; }, beiAenderung: function (w) { Z.animation = false; setzeNetz(w / 100); } });
  ui.abspielen = el('button', { type: 'button', 'class': 'knopf', text: '▶ Aufklappen', onclick: netzAbspielen });
  ui.netzSumme = el('div', { 'class': 'gleichung' });
  ui.pNetz = LAB.karte('Netz', [el('p', { 'class': 'klein', html: fmt(T.modi.netz) }), ui.netzRegler.el,
    el('div', { 'class': 'knopfreihe' }, [ui.abspielen]), ui.netzSumme]);
  [ui.pErkunden, ui.pDreieck, ui.pNetz].forEach(function (p) { s.steuer.appendChild(p); });

  // Werte-Tafel
  ui.tafel = el('table', { 'class': 'tafel' });
  ui.rw = LAB.schalter({ label: 'Rechenweg zeigen', wert: false, beiAenderung: function (w) { Z.rechenweg = w; zeichnen(); } });
  s.steuer.appendChild(LAB.karte('Werte-Tafel', [ui.rw.el, ui.tafel, el('p', { 'class': 'klein', html: fmt(T.tafel_hinweis) })]));

  // unten: Einführung, Aufgaben, Annahmen
  var NIV = { '▽': 'n1', '◪': 'n2', '☒': 'n3' };
  s.unten.appendChild(LAB.karte('Aufgaben', [el('p', { html: fmt(T.einfuehrung) }), el('ul', { 'class': 'aufgaben' }, T.aufgaben.map(function (a) {
    return el('li', {}, [el('span', { 'class': 'niveau ' + (NIV[a.niveau] || 'n1'), 'aria-label': a.stufe, text: a.niveau }),
      el('div', {}, [el('div', { html: fmt(a.text) }), a.tipp ? el('details', {}, [el('summary', { text: 'Tipp' }), el('p', { html: fmt(a.tipp) })]) : null])]);
  }))]));
  s.unten.appendChild(LAB.annahmen('So ist das Modell gebaut', T.annahmen.map(fmt)));
  s.unten.appendChild(el('p', { 'class': 'klein', text: T.fusszeile }));

  /* ---------- Kamera ---------- */
  function kamWinkel(k) { return k.art === 'schraeg' ? R3D.FREI_START : k; }
  // weicher Übergang: Winkel drehen; das Schrägbild (keine Drehung) wird am Anfang/Ende eingeblendet
  function uebergangsMatrix(von, nach, e) {
    var a = kamWinkel(von), b = kamWinkel(nach), dd = ((b.dreh - a.dreh + 540) % 360) - 180;
    var M = R3D.matrix({ art: 'dreh', dreh: a.dreh + dd * e, kipp: a.kipp + (b.kipp - a.kipp) * e });
    if (von.art === 'schraeg') M = R3D.mische(R3D.matrix(von), M, Math.min(1, e / 0.25));
    if (nach.art === 'schraeg') M = R3D.mische(M, R3D.matrix(nach), Math.max(0, (e - 0.75) / 0.25));
    return M;
  }
  function aktuelleMatrix() {
    var u = Z.uebergang;
    if (!u) return R3D.matrix(Z.kam);
    var x = Math.min(1, (Date.now() - u.start) / u.dauer);
    if (x >= 1) { Z.uebergang = null; return R3D.matrix(Z.kam); }
    return uebergangsMatrix(u.von, Z.kam, x * x * (3 - 2 * x));
  }
  function setzeKamera(kam, sanft) {
    var von = Z.kam;
    Z.kam = kam;
    Z.uebergang = sanft && !LAB.wenigerBewegung() ? { von: von, start: Date.now(), dauer: 500 } : null;
    zeichnen();
  }
  function waehleAnsicht(w) { Z.ansicht = w; ui.ansicht.setze(w); setzeKamera(R3D.ANSICHTEN[w], true); }
  R3D.steuerung(ui.buehne, function (dDreh, dKipp) {
    Z.uebergang = null; Z.vorNetz = null;
    if (Z.ansicht) { Z.ansicht = null; ui.ansicht.setze(null); }
    Z.kam = R3D.drehen(Z.kam, dDreh, dKipp);
    zeichnen();
  });

  /* ---------- Modi ---------- */
  function waehleModus(w) {
    Z.modus = w; ui.modus.setze(w);
    if (w !== 'netz') { Z.animation = false; if (Z.vorNetz) { var v = Z.vorNetz; Z.vorNetz = null; Z.ansicht = v.ansicht; ui.ansicht.setze(v.ansicht); setzeKamera(v.kam, true); } }
    Z.massstab = null;
    zeichnen();
  }
  function setzeNetz(t) {
    Z.netz = Math.min(1, Math.max(0, t));
    ui.netzRegler.setze(Math.round(Z.netz * 100));
    if (Z.netz >= 1 && Z.ansicht !== 'oben') {                   // bei 100 %: Draufsicht
      Z.vorNetz = { kam: Z.kam, ansicht: Z.ansicht }; waehleAnsicht('oben');
    } else if (Z.netz < 1 && Z.vorNetz && Z.ansicht === 'oben') {  // wieder zuklappen: alte Ansicht zurück
      var v = Z.vorNetz; Z.vorNetz = null; Z.ansicht = v.ansicht; ui.ansicht.setze(v.ansicht); setzeKamera(v.kam, true);
    }
    zeichnen();
  }
  function netzAbspielen() {
    var ziel = Z.netz < 1 ? 1 : 0, von = Z.netz;
    if (LAB.wenigerBewegung()) { setzeNetz(ziel); return; }
    var start = Date.now(), dauer = 2400 * Math.abs(ziel - von);
    Z.animation = true;
    (function schritt() {
      if (!Z.animation) return;
      var x = Math.min(1, (Date.now() - start) / dauer);
      setzeNetz(von + (ziel - von) * x);
      if (x < 1) requestAnimationFrame(schritt); else Z.animation = false;
    })();
  }

  /* ---------- Szene ---------- */
  function strecke(a, b, klasse, text, bezug) { return { a: a, b: b, klasse: klasse, text: text, textKlasse: text ? 't-' + klasse.slice(2) : null, bezug: bezug }; }
  function szene(m) {
    var e = PYR.ecken(m), netz = Z.modus === 'netz', teile = netz ? PYR.netz(m, Z.netz) : PYR.koerper(m);
    var sz = { flaechen: [], strecken: [], winkel: [], marken: [], flaechenTexte: [], bezug: [0, m.hK / 3, 0] };
    teile.flaechen.forEach(function (f) {
      sz.flaechen.push({ punkte: f.punkte, klasse: f.id === 'G' ? 'fl-g' : 'fl-m', ebene: f.id === 'G' ? -1 : 0 });
    });
    teile.kanten.forEach(function (k) { sz.strecken.push({ a: k[0], b: k[1], klasse: 'k' }); });
    if (!netz || Z.netz < 0.85) {          // ab 85 % stehen die Flächeninhalte in den Flächen
      sz.strecken[0].text = 'a'; sz.strecken[0].bezug = e.F;
      sz.strecken[1].text = 'b'; sz.strecken[1].bezug = e.F;
    }
    if (!netz || Z.netz === 0) sz.marken.push({ p: e.S, text: 'S', bezug: e.F });
    if (Z.modus === 'erkunden') {
      if (Z.zeige.diag) { sz.strecken.push({ a: e.A, b: e.C, klasse: 'k-d' }, { a: e.B, b: e.D, klasse: 'k-d' }); }
      if (Z.zeige.hK) {
        sz.strecken.push(strecke(e.S, e.F, 's-hk', 'h_K', e.B));
        sz.winkel.push({ ecke: e.F, zu1: e.S, zu2: e.Ma, klasse: 's-hk' });
      }
      if (Z.zeige.hK || Z.zeige.diag) sz.marken.push({ p: e.F, text: 'F', bezug: e.B });
      if (Z.zeige.ha) {
        sz.strecken.push(strecke(e.S, e.Ma, 's-ha', 'h_a', e.F));
        sz.winkel.push({ ecke: e.Ma, zu1: e.S, zu2: e.B, klasse: 's-ha' });
      }
      if (Z.zeige.hb && !m.quadrat) {
        sz.strecken.push(strecke(e.S, e.Mb, 's-ha', 'h_b', e.F));
        sz.winkel.push({ ecke: e.Mb, zu1: e.S, zu2: e.B, klasse: 's-ha' });
      }
      if (Z.zeige.s) sz.strecken.push(strecke(e.S, e.B, 's-s', 's', e.F));
    } else if (Z.modus === 'dreieck') {
      var D = PYR.stuetzdreieck(Z.dreieck, Z.seite, m), mitte = R3D.schwerpunkt([D.ecke, D.p1, D.p2]);
      sz.flaechen.push({ punkte: [D.ecke, D.p1, D.p2], klasse: 'fl-d', deckt: false, ebene: 0 });
      sz.strecken.push(strecke(D.ecke, D.p1, 's-' + D.k1.klasse, D.k1.name, mitte), strecke(D.ecke, D.p2, 's-' + D.k2.klasse, D.k2.name, mitte),
        strecke(D.p1, D.p2, 's-' + D.hyp.klasse, D.hyp.name, mitte));
      sz.winkel.push({ ecke: D.ecke, zu1: D.p1, zu2: D.p2, klasse: 'k' });
      if (D.nr !== 'D3') sz.marken.push({ p: e.F, text: 'F', bezug: mitte });
    } else if (Z.netz >= 0.85) {
      // Flächeninhalte in die Flächen schreiben (Dreieck: auf halber Höhe, damit „a“/„b“ an der Kante frei bleiben)
      teile.flaechen.forEach(function (f) {
        var inhalt = R3D.flaecheninhalt(f.punkte), p = f.id === 'G' ? R3D.schwerpunkt(f.punkte) : R3D.mitte(R3D.mitte(f.punkte[0], f.punkte[1]), f.punkte[2]);
        sz.flaechenTexte.push({ p: p, text: (f.id === 'G' ? 'G = ' : '') + LAB.wert(inhalt, 2) + ' ' + Z.einheit + '^2', klasse: f.id === 'G' ? 't-g' : 't-m' });
      });
    }
    var weit = 0;
    teile.flaechen.forEach(function (f) { f.punkte.forEach(function (p) { weit = Math.max(weit, Math.abs(p[0]), Math.abs(p[2])); }); });
    sz.gitter = { n: Math.min(24, Math.ceil(weit) + 1) };
    // Kugel für den Maßstab: im Netz-Modus fest (Körper bis ganz aufgeklappt), sonst der Körper selbst
    sz.alle = [];
    teile.flaechen.forEach(function (f) { sz.alle = sz.alle.concat(f.punkte); });
    if (netz) sz.kugel = { mitte: [0, 0, 0], radius: Math.max(m.b / 2 + m.ha, m.a / 2 + m.hb, m.d / 2, m.hK) };
    else sz.kugel = R3D.umkugel(sz.alle);
    return sz;
  }

  /* ---------- Stützdreieck flach daneben + Gleichung ---------- */
  function flachSvg(D) {
    var W = 340, H = 230, rl = 58, rr = 46, ro = 34, ru = 50, f = 18;
    var k1 = D.k1.wert, k2 = D.k2.wert, m = Math.min((W - rl - rr) / k2, (H - ro - ru) / k1);
    var x0 = rl + ((W - rl - rr) - k2 * m) / 2, y0 = H - ru, x2 = x0 + k2 * m, y1 = y0 - k1 * m, g = Math.min(14, 0.3 * Math.min(k1, k2) * m);
    function n(v) { return Math.round(v * 10) / 10; }
    function linie(xa, ya, xb, yb, k) { return '<line class="s-' + k + '" x1="' + n(xa) + '" y1="' + n(ya) + '" x2="' + n(xb) + '" y2="' + n(yb) + '"/>'; }
    var hl = Math.sqrt(k2 * k2 + k1 * k1) * m, nx = (y0 - y1) / hl, ny = -(x2 - x0) / hl;   // Normale der Hypotenuse nach außen
    return '<svg class="flach" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Stützdreieck ' + D.nr + ' flach: rechter Winkel unten links">' +
      '<g font-size="' + f + '"><polygon class="fl-d" points="' + [x0, y0, x0, y1, x2, y0].map(n).join(' ') + '"/>' +
      linie(x0, y0, x0, y1, D.k1.klasse) + linie(x0, y0, x2, y0, D.k2.klasse) + linie(x0, y1, x2, y0, D.hyp.klasse) +
      '<polyline class="wi k" points="' + [x0 + g, y0, x0 + g, y0 - g, x0, y0 - g].map(n).join(' ') + '"/>' +
      R3D.text(x0 - 26, (y0 + y1) / 2, D.k1.name, 't-' + D.k1.klasse, f) +
      R3D.text((x0 + x2) / 2, y0 + (/\//.test(D.k2.name) ? 22 : 18), D.k2.name, 't-' + D.k2.klasse, f) +
      R3D.text((x0 + x2) / 2 + nx * 18, (y0 + y1) / 2 + ny * 18, D.hyp.name, 't-' + D.hyp.klasse, f) +
      R3D.text(x0 - 12, y1 - 12, 'S', '', f) + '</g></svg>';
  }
  function zeile(html, klasse) { return '<div class="zeile' + (klasse ? ' ' + klasse : '') + '">' + html + '</div>'; }
  // Pythagoras-Rechnung wie im Buch: Formel → Einsetzen → Quadrate → Summe | √ → Ergebnis
  function pythagoras(D, m) {
    var h = D.hyp, k1 = D.k1, k2 = D.k2, z = [];
    function ein(k) { return /h_a|h_b|d\/2/.test(k.name) ? Q(k.q) : K(k.wert); }   // abgeleitete Größen: mit dem Quadrat weiterrechnen
    if (D.nr === 'D2') z.push(zeile('Zuerst die Diagonale ' + gr('d') + ' der Grundfläche: ' + gr('d') + '<sup>2</sup> = a<sup>2</sup> + b<sup>2</sup> = ' +
      K(m.a) + ' + ' + K(m.b) + ' = ' + Q(m.d2) + ', also ' + gr('d') + ' ' + rel(m.d) + ' ' + L(m.d) + ' und ' +
      grQ('d/2') + ' = ' + gr('d') + '<sup>2</sup> : 4 = ' + Q(m.d2 / 4), 'vor'));
    if (D.nr === 'D3') {
      var e1 = D.seite === 'b' ? 'a/2' : (m.quadrat ? 'a/2' : 'b/2');
      z.push(zeile('Zuerst ' + gr(k1.name) + ' mit D1: ' + grQ(k1.name) + ' = ' + grQ('h_K') + ' + ' + grQ(e1) + ' = ' + Q(k1.q), 'vor'));
    }
    z.push(zeile('Hypotenuse (gegenüber vom rechten Winkel): ' + gr(h.name) + ' · Katheten: ' + gr(k1.name) + ' und ' + gr(k2.name), 'vor'));
    z.push(zeile(grQ(h.name) + ' = ' + grQ(k1.name) + ' + ' + grQ(k2.name)));
    var a1 = ein(k1), a2 = ein(k2);
    z.push(zeile(grQ(h.name) + ' = ' + a1 + ' + ' + a2));
    if (/\(/.test(a1 + a2)) z.push(zeile(grQ(h.name) + ' = ' + Q(k1.q) + ' + ' + Q(k2.q)));
    z.push(zeile(grQ(h.name) + ' = ' + Q(h.q) + '<span class="rand">| √</span>'));
    z.push(zeile(gr(h.name) + ' ' + rel(h.wert) + ' ' + L(h.wert), 'ergebnis'));
    z.push(zeile('Umgestellt, wenn ' + gr(h.name) + ' gegeben ist: ' + grQ(k1.name) + ' = ' + grQ(h.name) + ' − ' + grQ(k2.name), 'vor'));
    return z.join('');
  }

  /* ---------- Werte-Tafel mit Rechenweg ---------- */
  function tafel(m) {
    var q = m.quadrat, hb = q ? 'a/2' : 'b/2';
    var zeilen = [
      ['a', L(m.a), 'gegeben'],
      ['b', L(m.b), q ? 'Quadrat: b = a' : 'gegeben'],
      [gr('h_K'), L(m.hK), 'gegeben'],
      [gr('h_a'), rel(m.ha) + ' ' + L(m.ha), grQ('h_a') + ' = ' + grQ('h_K') + ' + ' + grQ(hb) + ' = ' + K(m.hK) + ' + ' + K(m.b / 2) + ' = ' + Q(m.ha2) +
        ' | √ → ' + gr('h_a') + ' ' + rel(m.ha) + ' ' + L(m.ha)],
      [gr('h_b'), rel(m.hb) + ' ' + L(m.hb), q ? 'Quadrat: ' + gr('h_b') + ' = ' + gr('h_a') : grQ('h_b') + ' = ' + grQ('h_K') + ' + ' + grQ('a/2') + ' = ' +
        K(m.hK) + ' + ' + K(m.a / 2) + ' = ' + Q(m.hb2) + ' | √ → ' + gr('h_b') + ' ' + rel(m.hb) + ' ' + L(m.hb)],
      [gr('s'), rel(m.s) + ' ' + L(m.s), grQ('s') + ' = ' + grQ('h_a') + ' + ' + grQ('a/2') + ' = ' + Q(m.ha2) + ' + ' + K(m.a / 2) + ' = ' + Q(m.s2) +
        ' | √ → ' + gr('s') + ' ' + rel(m.s) + ' ' + L(m.s)],
      [gr('G'), rel(m.G) + ' ' + F(m.G, 2), gr('G') + ' = a · b = ' + L(m.a) + ' · ' + L(m.b) + ' ' + rel(m.G) + ' ' + F(m.G, 2)],
      [gr('M'), rel(m.M) + ' ' + F(m.M, 2), (q ? gr('M') + ' = 4 · a · ' + gr('h_a') + ' : 2 = 2 · a · ' + gr('h_a') + ' = 2 · ' + L(m.a) + ' · ' + L(m.ha)
        : gr('M') + ' = 2 · a · ' + gr('h_a') + ' : 2 + 2 · b · ' + gr('h_b') + ' : 2 = a · ' + gr('h_a') + ' + b · ' + gr('h_b') + ' = ' + L(m.a) + ' · ' + L(m.ha) +
          ' + ' + L(m.b) + ' · ' + L(m.hb)) + ' ' + rel(m.M) + ' ' + F(m.M, 2)],
      ['O', rel(m.O) + ' ' + F(m.O, 2), 'O = ' + gr('G') + ' + ' + gr('M') + ' = ' + F(m.G, 2) + ' + ' + F(m.M, 2) + ' ' + rel(m.O) + ' ' + F(m.O, 2)],
      ['V', rel(m.V) + ' ' + F(m.V, 3), 'V = ' + fmt('1/3') + ' · ' + gr('G') + ' · ' + gr('h_K') + ' = ' + fmt('1/3') + ' · ' + F(m.G, 2) + ' · ' + L(m.hK) +
        ' ' + rel(m.V) + ' ' + F(m.V, 3)]
    ];
    ui.tafel.innerHTML = '<tbody>' + zeilen.map(function (z) {
      return '<tr><th scope="row">' + z[0] + '</th><td class="wert">' + z[1] + '</td></tr>' +
        (Z.rechenweg ? '<tr class="rw"><td colspan="2">' + z[2] + '</td></tr>' : '');
    }).join('') + '</tbody>';
  }

  /* ---------- Zeichnen (höchstens einmal je Bild) ---------- */
  function zeichnen() {
    if (Z.geplant) return;
    Z.geplant = true;
    requestAnimationFrame(function () { Z.geplant = false; jetztZeichnen(); });
  }
  function jetztZeichnen() {
    var m = PYR.masse(Z.a, Z.quadrat ? Z.a : Z.b, Z.hK);
    if (m.fehler) {
      ui.svg.innerHTML = '';
      ui.tafel.innerHTML = '<tbody><tr><td class="hinweis-fehler">' + esc(m.fehler) + '</td></tr></tbody>';
      return;
    }
    // Größe der Zeichenfläche (1 Einheit im SVG = 1 Pixel, damit die Schrift echte 17 px hat)
    var r = ui.buehne.getBoundingClientRect(), w = Math.max(200, Math.round(r.width)), h = Math.max(200, Math.round(r.height));
    if (!Z.groesse || Z.groesse[0] !== w || Z.groesse[1] !== h) { Z.groesse = [w, h]; Z.massstab = null; ui.svg.setAttribute('viewBox', '0 0 ' + w + ' ' + h); }
    var beamer = LAB.istBeamer(), schrift = beamer ? 24 : 17, rand = beamer ? 44 : 32;
    var sz = szene(m), M = aktuelleMatrix();
    var fit = R3D.passend(sz.kugel, M, w, h, rand);
    // Maßstab springt nicht bei jeder Reglerbewegung: nur wenn der Körper nicht mehr passt oder viel zu klein wird
    if (Z.modus === 'netz' || !Z.massstab || Z.massstab > fit * 1.0001 || Z.massstab < fit * 0.6) Z.massstab = fit;
    var B = R3D.zentriere(R3D.abbildung(M, sz.kugel.mitte, Z.massstab, w, h), sz.alle);
    ui.svg.innerHTML = R3D.svgSzene(sz, B, { schrift: schrift });

    [ui.pErkunden, ui.pDreieck, ui.pNetz].forEach(function (p, i) { p.hidden = ['erkunden', 'dreieck', 'netz'][i] !== Z.modus; });
    ui.schalter.hb.el.hidden = m.quadrat;
    ui.seite.el.hidden = m.quadrat;
    if (Z.modus === 'dreieck') {
      var D = PYR.stuetzdreieck(Z.dreieck, Z.seite, m);
      ui.dText.innerHTML = D.nr + ': ' + gr(D.k1.name) + ', ' + gr(D.k2.name) + ' und ' + gr(D.hyp.name) +
        (D.nr === 'D3' ? ' – liegt in der Seitenfläche über ' + D.seite : D.nr === 'D1' ? ' – steht senkrecht in der Pyramide' : ' – steht senkrecht über der Diagonale');
      ui.flach.innerHTML = flachSvg(D);
      ui.gleichung.innerHTML = pythagoras(D, m);
    }
    if (Z.modus === 'netz') {
      var fl = PYR.netzFlaechen(m, Z.netz), summe = 0;
      fl.forEach(function (f) { summe += f.inhalt; });
      ui.abspielen.textContent = Z.netz < 1 ? '▶ Aufklappen' : '◀ Zuklappen';
      ui.netzSumme.innerHTML = zeile('Summe der 5 Flächen (' + gr('G') + ' + 4 Dreiecke):', 'vor') +
        zeile(fl.map(function (f) { return F(f.inhalt, 2); }).join(' + ') + ' ' + rel(summe) + ' ' + F(summe, 2)) +
        zeile((Math.abs(summe - m.O) < 1e-9 * m.O ? 'Das ist genau die Oberfläche O = ' + gr('G') + ' + ' + gr('M') + ' ✓' : 'Abweichung von O!'), 'ergebnis');
    }
    tafel(m);
    if (Z.uebergang) zeichnen();
  }

  window.addEventListener('resize', zeichnen);
  zeichnen();
});

</script>
</body>
</html>
