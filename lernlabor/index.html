<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Das interaktive Lernlabor – Möglichkeiten digitalen Lernens in allen Fächern zum Ausprobieren (schulinterne Lehrerfortbildung).">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#111833">
<title>Das interaktive Lernlabor</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%A7%AA%3C/text%3E%3C/svg%3E">
<style>
/* Das interaktive Lernlabor – Gestaltung (Designsystem)
   Farben als Variablen, Systemschriften (keine externen Schriften = keine Datenübertragung). */
:root{
  --ink:#16203a; --ink2:#4a5572; --ink3:#6b7591; --bg:#f4f6fb; --flaeche:#fff; --linie:#dde2ee; --linie2:#c9d0e2;
  --akzent:#4f46e5; --akzent2:#7c3aed; --akzent-hell:#eef0ff;
  --ok:#15803d; --ok-hell:#e7f6ec; --nein:#b42318; --nein-hell:#fdecea; --info:#0b5cad; --info-hell:#e8f1fc; --warn:#a15c07; --warn-hell:#fff4e0;
  --voll:#15803d; --proto:#a15c07; --konzept:#6b7591;
  --fach:#4f46e5; --fach-hell:#eef0ff;
  --r:16px; --r2:10px; --schatten:0 1px 2px rgba(22,32,58,.06),0 6px 24px rgba(22,32,58,.07); --schatten2:0 10px 40px rgba(22,32,58,.16);
  --schrift:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --s:1rem;
}
*{box-sizing:border-box}
html{font-size:17px;scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{animation:none!important;transition:none!important}}
body{margin:0;font-family:var(--schrift);color:var(--ink);background:var(--bg);line-height:1.55;-webkit-text-size-adjust:100%}
body.praesentation{font-size:1.18rem}
a{color:var(--akzent)}
h1,h2,h3,h4{line-height:1.2;margin:.2em 0 .45em;letter-spacing:-.01em}
h1{font-size:clamp(1.8rem,4.2vw,3.1rem)} h2{font-size:clamp(1.35rem,2.6vw,1.9rem)} h3{font-size:1.18rem} h4{font-size:1.02rem}
p{margin:.35em 0 .8em}
.wrap{max-width:1200px;margin:0 auto;padding:0 20px}
.klein{font-size:.86rem;color:var(--ink2)}
.versteckt{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:3px solid #f59e0b;outline-offset:2px;border-radius:6px}
.sprung{position:absolute;left:-999px;top:0;background:#000;color:#fff;padding:8px 12px;z-index:99}
.sprung:focus{left:8px}
noscript div,.ohne-js{background:#fff3cd;border:1px solid #e0b84f;padding:14px;margin:14px;border-radius:10px}

/* ---------- Kopfzeile ---------- */
.kopf{position:sticky;top:0;z-index:40;background:rgba(255,255,255,.92);backdrop-filter:saturate(1.4) blur(10px);-webkit-backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--linie)}
.kopf .wrap{display:flex;align-items:center;gap:14px;min-height:62px}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;color:var(--ink);text-decoration:none;white-space:nowrap}
.logo-zeichen{width:36px;height:36px;border-radius:11px;background:linear-gradient(135deg,var(--akzent),var(--akzent2));display:grid;place-items:center;color:#fff;font-size:1.15rem;box-shadow:0 4px 14px rgba(79,70,229,.35)}
.logo small{display:block;font-weight:500;color:var(--ink3);font-size:.72rem;letter-spacing:.02em}
.nav{display:flex;gap:2px;margin-left:auto;flex-wrap:wrap;justify-content:flex-end}
.nav a{padding:8px 9px;border-radius:9px;text-decoration:none;color:var(--ink2);font-weight:600;font-size:.86rem;white-space:nowrap}
.nav a:hover{background:var(--akzent-hell);color:var(--akzent)}
.nav a.aktiv{background:var(--akzent);color:#fff}
.merk-knopf{position:relative}
.merk-zahl{background:#f59e0b;color:#fff;border-radius:99px;font-size:.7rem;padding:1px 6px;margin-left:4px}
.menue-knopf{display:none;margin-left:auto;border:1px solid var(--linie2);background:#fff;border-radius:10px;padding:8px 12px;font:inherit;font-weight:700;cursor:pointer;white-space:nowrap}
@media (max-width:1200px){
  .menue-knopf{display:block}
  .nav{display:none;position:absolute;left:0;right:0;top:62px;background:#fff;border-bottom:1px solid var(--linie);flex-direction:column;padding:10px 16px 16px;box-shadow:var(--schatten2)}
  .nav.offen{display:flex}
  .nav a{padding:12px 12px;font-size:1rem}
}

/* ---------- Grundbausteine ---------- */
.knopf{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:10px 18px;border-radius:12px;border:0;background:var(--akzent);color:#fff;font:inherit;font-weight:700;cursor:pointer;text-decoration:none;transition:transform .12s,box-shadow .12s,background .12s;box-shadow:0 2px 10px rgba(79,70,229,.25)}
.knopf:hover{transform:translateY(-1px);box-shadow:0 6px 18px rgba(79,70,229,.3)}
.knopf:active{transform:translateY(0)}
.knopf:disabled{opacity:.45;cursor:not-allowed;transform:none}
.knopf.zweit{background:#fff;color:var(--ink);border:1.5px solid var(--linie2);box-shadow:none}
.knopf.zweit:hover{border-color:var(--akzent);color:var(--akzent)}
.knopf.klein{min-height:36px;padding:6px 12px;font-size:.88rem;border-radius:10px}
.knopf.gruen{background:var(--ok);box-shadow:none}
.knopf.hell{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.4);box-shadow:none}
.knopfreihe{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:10px 0}
.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:99px;background:#eef1f8;color:var(--ink2);font-size:.78rem;font-weight:600;white-space:nowrap}
.chip.fach{background:var(--fach-hell);color:var(--fach)}
button.chip{border:1.5px solid transparent;cursor:pointer;font:inherit;font-size:.82rem;font-weight:600;min-height:34px;padding:4px 12px}
button.chip[aria-pressed="true"]{background:var(--akzent);color:#fff}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:.74rem;font-weight:800;letter-spacing:.02em;padding:3px 9px;border-radius:99px;white-space:nowrap}
.badge.voll{background:var(--ok-hell);color:var(--voll)} .badge.proto{background:var(--warn-hell);color:var(--proto)} .badge.konzept{background:#eef0f4;color:var(--konzept)}
.badge.innovativ{background:#f3e8ff;color:#7e22ce} .badge.etabliert{background:#e0f2fe;color:#075985}
.badge.ev-gut{background:var(--ok-hell);color:var(--ok)} .badge.ev-mittel{background:var(--warn-hell);color:var(--warn)} .badge.ev-empf{background:var(--info-hell);color:var(--info)} .badge.ev-idee{background:#f3e8ff;color:#7e22ce}
.raster{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:18px}
.raster.eng{grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.raster.breit{grid-template-columns:repeat(auto-fill,minmax(340px,1fr))}
.karte{background:var(--flaeche);border:1px solid var(--linie);border-radius:var(--r);padding:18px;box-shadow:var(--schatten);position:relative}
a.karte,button.karte{display:block;text-decoration:none;color:inherit;text-align:left;font:inherit;cursor:pointer;transition:transform .15s,box-shadow .15s,border-color .15s;width:100%}
a.karte:hover,button.karte:hover{transform:translateY(-3px);box-shadow:var(--schatten2);border-color:var(--linie2)}
.karte h3{margin-top:.1em}
.karte .unten{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.karte .unten .chip{max-width:100%;overflow:hidden;text-overflow:ellipsis}
.abschnitt{padding:46px 0}
.abschnitt.dunkel{background:#121a33;color:#e8ecf8}
.abschnitt.dunkel .klein{color:#aab4d4}
.unterzeile{color:var(--ink2);font-size:1.05rem;max-width:780px}
.kasten{border-radius:var(--r2);padding:12px 16px;margin:12px 0;border:1px solid}
.kasten.info{background:var(--info-hell);border-color:#b9d4f3} .kasten.warn{background:var(--warn-hell);border-color:#f0cf95} .kasten.ok{background:var(--ok-hell);border-color:#a9dcb8}
.zwei{display:grid;grid-template-columns:1fr 1fr;gap:22px} @media (max-width:820px){.zwei{grid-template-columns:1fr}}
.drei{display:grid;grid-template-columns:repeat(3,1fr);gap:18px} @media (max-width:900px){.drei{grid-template-columns:1fr}}
.liste-ohne{list-style:none;padding:0;margin:0}
.seitenkopf{padding:38px 0 18px}
.brot{font-size:.85rem;color:var(--ink3);margin-bottom:6px}
.brot a{color:var(--ink3)}
table.tab{border-collapse:collapse;width:100%;font-size:.88rem;background:#fff}
table.tab th,table.tab td{border:1px solid var(--linie);padding:6px 8px;text-align:left;vertical-align:top}
table.tab th{background:#f0f2f8;position:sticky;top:0}
.tab-huelle{overflow:auto;max-height:70vh;border-radius:10px;border:1px solid var(--linie)}
input[type=text],input[type=number],textarea,select{font:inherit;color:inherit;border:1.5px solid var(--linie2);border-radius:10px;padding:9px 11px;background:#fff;min-height:44px;max-width:100%}
textarea{width:100%;min-height:130px;resize:vertical;line-height:1.5}
input:focus,textarea:focus,select:focus{border-color:var(--akzent);outline:none;box-shadow:0 0 0 3px rgba(79,70,229,.18)}
.suchfeld{width:100%;max-width:440px}

/* ---------- Startseite ---------- */
.hero{background:radial-gradient(1200px 500px at 85% -10%,#5b4cf0 0%,transparent 60%),radial-gradient(900px 500px at 0% 110%,#0ea5e9 0%,transparent 55%),#111833;color:#fff;overflow:hidden;position:relative}
.hero .wrap{display:grid;grid-template-columns:1.1fr .9fr;gap:30px;align-items:center;padding-top:64px;padding-bottom:64px}
@media (max-width:900px){.hero .wrap{grid-template-columns:1fr;padding-top:40px}}
.hero h1{color:#fff;margin-bottom:.3em}
.hero h1 em{font-style:normal;background:linear-gradient(90deg,#a5b4fc,#67e8f9);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p.gross{font-size:1.15rem;color:#d6dcf5;max-width:620px}
.hero-zahlen{display:flex;gap:26px;flex-wrap:wrap;margin-top:22px}
.hero-zahlen b{display:block;font-size:1.9rem;color:#fff}
.hero-zahlen span{color:#aab4d4;font-size:.85rem}
.hero-buehne{position:relative;min-height:330px}
.hero-buehne svg{width:100%;height:auto;display:block}
.schwebe{animation:schwebe 6s ease-in-out infinite}
.schwebe2{animation:schwebe 7.5s ease-in-out infinite reverse}
@keyframes schwebe{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.wege{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px;margin-top:-36px;position:relative;z-index:2}
.weg{background:#fff;border-radius:var(--r);padding:20px;box-shadow:var(--schatten2);text-decoration:none;color:inherit;border:1px solid var(--linie);transition:transform .15s}
.weg:hover{transform:translateY(-4px)}
.weg .ic{font-size:1.8rem}
.weg b{display:block;font-size:1.08rem;margin:6px 0 2px}
.vergleich{display:grid;grid-template-columns:1fr auto 1fr;gap:16px;align-items:stretch}
@media (max-width:760px){.vergleich{grid-template-columns:1fr}}
.vergleich .pfeil{display:grid;place-items:center;font-size:2rem;color:var(--akzent)}

/* ---------- Fächer ---------- */
.fachkachel{--fach:#4f46e5;border-top:5px solid var(--fach)}
.fachkachel .emo{font-size:2rem;line-height:1}
.fachkachel .zahl{font-size:.8rem;color:var(--ink3)}
.gruppe-titel{margin:34px 0 12px;font-size:.95rem;text-transform:uppercase;letter-spacing:.08em;color:var(--ink3)}
.fach-hero{background:linear-gradient(135deg,var(--fach) 0%,color-mix(in srgb,var(--fach) 60%,#111833) 100%);color:#fff;position:relative;overflow:hidden}
.fach-hero .wrap{padding-top:40px;padding-bottom:40px;display:grid;grid-template-columns:1.3fr .7fr;gap:20px;align-items:center}
@media (max-width:820px){.fach-hero .wrap{grid-template-columns:1fr}}
.fach-hero h1{color:#fff}
.fach-hero p{color:rgba(255,255,255,.9);font-size:1.08rem}
.fach-hero .brot,.fach-hero .brot a{color:rgba(255,255,255,.8)}
.fach-emo{font-size:clamp(4rem,10vw,7.5rem);text-align:center;filter:drop-shadow(0 10px 20px rgba(0,0,0,.25))}
.fach-muster{position:absolute;inset:0;opacity:.13;pointer-events:none}
.chancen li{margin:.35em 0}
.phasenleiste{display:flex;flex-wrap:wrap;gap:8px}

/* ---------- Demo-Rahmen ---------- */
.demo{background:#fff;border:1px solid var(--linie);border-radius:18px;box-shadow:var(--schatten);margin:18px 0;overflow:hidden}
.demo-kopf{display:flex;flex-wrap:wrap;align-items:flex-start;gap:10px 14px;padding:16px 18px 10px;border-bottom:1px solid var(--linie);background:linear-gradient(180deg,#fbfcff,#fff)}
.demo-kopf h3{margin:0;font-size:1.15rem}
.demo-kopf .rechts{margin-left:auto;display:flex;gap:6px;align-items:center}
.demo-kopf .chips{display:flex;flex-wrap:wrap;gap:6px;width:100%}
.demo-auftrag{padding:12px 18px 0;color:var(--ink2)}
.demo-flaeche{padding:14px 18px 18px}
.demo-fuss{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 18px;border-top:1px solid var(--linie);background:#fafbfe}
.stern{border:1.5px solid var(--linie2);background:#fff;border-radius:10px;min-width:40px;min-height:40px;font-size:1.15rem;cursor:pointer;color:#c2c8d8}
.stern[aria-pressed="true"]{color:#f59e0b;border-color:#f59e0b;background:#fff8eb}
details.didaktik{border-top:1px solid var(--linie)}
details.didaktik>summary{cursor:pointer;padding:12px 18px;font-weight:700;color:var(--akzent);list-style:none;display:flex;align-items:center;gap:8px}
details.didaktik>summary::-webkit-details-marker{display:none}
details.didaktik>summary::before{content:"▸";transition:transform .15s}
details.didaktik[open]>summary::before{transform:rotate(90deg)}
.did-raster{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;padding:0 18px 18px}
.did-punkt{background:#f7f8fc;border-radius:12px;padding:10px 12px;border:1px solid var(--linie)}
.did-punkt b{display:block;font-size:.78rem;text-transform:uppercase;letter-spacing:.05em;color:var(--ink3);margin-bottom:3px}
.did-punkt p{margin:0;font-size:.92rem}
.did-punkt.grenze{background:#fff8f0;border-color:#f3dcc0}
.did-punkt.forschung{background:#f4f2ff;border-color:#ddd7fb}

/* Rückmeldungen */
.fb{border-radius:12px;padding:10px 14px;margin:10px 0;font-size:.95rem;border:1px solid;animation:rein .25s ease}
.fb.ok{background:var(--ok-hell);border-color:#a9dcb8;color:#0f5a2b}
.fb.nein{background:var(--nein-hell);border-color:#f2b8b1;color:#8a1c12}
.fb.info{background:var(--info-hell);border-color:#b9d4f3;color:#0a4a8c}
.fb.warn{background:var(--warn-hell);border-color:#f0cf95;color:#7a4504}
@keyframes rein{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.hilfe-stufe{border:1.5px dashed var(--linie2);border-radius:12px;padding:10px 14px;margin:8px 0;background:#fffdf5}
.punkte{font-weight:800;color:var(--akzent)}
.fortschritt{height:10px;background:#e7eaf3;border-radius:99px;overflow:hidden;margin:8px 0}
.fortschritt>i{display:block;height:100%;background:linear-gradient(90deg,var(--akzent),#22c55e);border-radius:99px;transition:width .35s}

/* Aufgaben-Bausteine */
.optionen{display:grid;gap:8px;margin:10px 0}
.option{display:flex;gap:10px;align-items:flex-start;text-align:left;border:1.5px solid var(--linie2);background:#fff;border-radius:12px;padding:11px 14px;font:inherit;cursor:pointer;min-height:46px;transition:border-color .12s,background .12s}
.option:hover{border-color:var(--akzent)}
.option[aria-pressed="true"],.option.gewaehlt{border-color:var(--akzent);background:var(--akzent-hell)}
.option.richtig{border-color:var(--ok);background:var(--ok-hell)}
.option.falsch{border-color:var(--nein);background:var(--nein-hell)}
.option .mark{flex:0 0 26px;height:26px;border-radius:8px;border:1.5px solid var(--linie2);display:grid;place-items:center;font-weight:800;font-size:.8rem;color:var(--ink3)}
.frage{font-weight:700;font-size:1.04rem;margin:6px 0}
.luecke{display:inline-block;min-width:90px;min-height:36px;padding:4px 8px;margin:2px 3px;border-radius:8px}
select.luecke{padding-right:26px}
.luecke.ok{border-color:var(--ok);background:var(--ok-hell)} .luecke.nein{border-color:var(--nein);background:var(--nein-hell)}
.lueckentext{line-height:2.4;font-size:1.02rem}
.kartenstapel{display:flex;flex-wrap:wrap;gap:8px;min-height:52px;padding:10px;border:2px dashed var(--linie2);border-radius:14px;background:#fafbfe}
.zettel{border:1.5px solid var(--linie2);background:#fff;border-radius:11px;padding:8px 12px;font:inherit;font-size:.95rem;cursor:pointer;min-height:42px;text-align:left;box-shadow:0 1px 2px rgba(0,0,0,.05);transition:transform .1s,border-color .1s}
.zettel:hover{border-color:var(--akzent)}
.zettel.aktiv{border-color:var(--akzent);background:var(--akzent-hell);transform:translateY(-2px);box-shadow:0 6px 14px rgba(79,70,229,.2)}
.zettel.richtig{border-color:var(--ok);background:var(--ok-hell)} .zettel.falsch{border-color:var(--nein);background:var(--nein-hell)}
.koerbe{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-top:12px}
.korb{border:2px solid var(--linie);border-radius:14px;padding:10px;background:#fff;min-height:110px;cursor:pointer;transition:border-color .12s,background .12s}
.korb.ziel{border-color:var(--akzent);background:var(--akzent-hell)}
.korb h4{margin:0 0 8px;font-size:.92rem}
.korb .inhalt{display:flex;flex-direction:column;gap:6px}
.paare{display:grid;grid-template-columns:1fr 1fr;gap:10px 16px}
@media (max-width:620px){.paare{grid-template-columns:1fr}}
.reihe-liste{list-style:none;padding:0;margin:10px 0;display:grid;gap:8px}
.reihe-liste li{display:flex;align-items:center;gap:8px;border:1.5px solid var(--linie2);border-radius:12px;padding:8px 10px;background:#fff}
.reihe-liste li .nr{font-weight:800;color:var(--ink3);width:24px;text-align:center}
.reihe-liste li .txt{flex:1}
.reihe-liste li.richtig{border-color:var(--ok);background:var(--ok-hell)} .reihe-liste li.falsch{border-color:var(--nein);background:var(--nein-hell)}
.pfeilknopf{border:1px solid var(--linie2);background:#fff;border-radius:8px;min-width:38px;min-height:38px;cursor:pointer;font-size:1rem}
.markiertext{line-height:2.05;font-size:1.04rem;background:#fffefa;border:1px solid #efe7cf;border-radius:12px;padding:14px 16px}
.markiertext .w{cursor:pointer;border-radius:4px;padding:1px 1px;transition:background .1s}
.markiertext .w:hover{background:#fff1b8}
.markiertext .w.m0{background:#fde68a} .markiertext .w.m1{background:#bfdbfe} .markiertext .w.m2{background:#bbf7d0} .markiertext .w.m3{background:#fbcfe8}
.markiertext .w.soll{outline:2px dashed var(--ok);outline-offset:1px}
.markiertext .w.fehltreffer{outline:2px solid var(--nein)}
.markiertext .satz{cursor:pointer;border-radius:5px;padding:2px 0}
.markiertext .satz:hover{background:#fff1b8}
.stifte{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.stift{border:2px solid transparent;border-radius:99px;padding:6px 14px;font:inherit;font-weight:700;cursor:pointer;min-height:40px}
.stift[aria-pressed="true"]{border-color:var(--ink)}
.stift.m0{background:#fde68a}.stift.m1{background:#bfdbfe}.stift.m2{background:#bbf7d0}.stift.m3{background:#fbcfe8}
.karteikarte{perspective:1200px;max-width:520px;margin:10px auto}
.karteikarte .innen{position:relative;min-height:190px;transition:transform .5s;transform-style:preserve-3d}
.karteikarte.um .innen{transform:rotateY(180deg)}
.karteikarte .seite{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:18px;display:grid;place-items:center;text-align:center;padding:18px;font-size:1.25rem;font-weight:700;border:1.5px solid var(--linie2);background:#fff;box-shadow:var(--schatten)}
.karteikarte .rueck{transform:rotateY(180deg);background:#f5f3ff}
.faecher-leitner{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:12px 0}
.fach-box{border-radius:10px;background:#eef1f8;text-align:center;padding:6px 2px;font-size:.78rem}
.fach-box b{display:block;font-size:1.3rem}
.chat{display:flex;flex-direction:column;gap:8px;background:#f5f7fb;border-radius:14px;padding:14px;max-height:420px;overflow:auto}
.blase{max-width:80%;padding:9px 13px;border-radius:16px;font-size:.98rem;animation:rein .25s}
.blase.sie{background:#fff;border:1px solid var(--linie);align-self:flex-start;border-bottom-left-radius:4px}
.blase.ich{background:var(--akzent);color:#fff;align-self:flex-end;border-bottom-right-radius:4px}
.blase.hinweis{align-self:center;background:var(--warn-hell);color:var(--warn);font-size:.85rem;max-width:95%}
.szene{background:linear-gradient(180deg,#f8f7ff,#fff);border:1px solid var(--linie);border-radius:16px;padding:18px}
.szene .bild{font-size:2.6rem}
.weg-spur{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.weg-spur span{font-size:.75rem;background:#eef1f8;border-radius:99px;padding:2px 9px}
.schloss{display:flex;align-items:center;gap:10px;border:2px solid var(--linie2);border-radius:14px;padding:12px;margin:10px 0;background:#fff}
.schloss.offen{border-color:var(--ok);background:var(--ok-hell)}
.schloss .ic{font-size:1.6rem}
.code{font-family:var(--mono);font-size:.92rem;background:#0f172a;color:#e2e8f0;border-radius:12px;padding:12px 14px;overflow:auto;line-height:1.6}
.code .zeile{display:block;padding:1px 6px;border-radius:5px;cursor:pointer;white-space:pre}
.code .zeile:hover{background:#1e293b}
.code .zeile.aktiv{background:#3730a3}
.code .zeile.richtig{background:#14532d} .code .zeile.falsch{background:#7f1d1d}
.parsons li{font-family:var(--mono);font-size:.9rem;white-space:pre}
.feld2d{position:relative;touch-action:none;user-select:none;-webkit-user-select:none}

/* ---------- Simulationen ---------- */
.sim{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(250px,1fr);gap:18px;align-items:start}
@media (max-width:860px){.sim{grid-template-columns:1fr}}
.sim-buehne{background:#fbfcff;border:1px solid var(--linie);border-radius:14px;padding:8px;position:relative}
.sim-buehne svg,.sim-buehne canvas{width:100%;height:auto;display:block;touch-action:none}
.sim-steuer{display:flex;flex-direction:column;gap:10px}
.regler{background:#f7f8fc;border:1px solid var(--linie);border-radius:12px;padding:8px 12px}
.regler label{display:flex;justify-content:space-between;gap:8px;font-weight:700;font-size:.9rem}
.regler output{font-family:var(--mono);color:var(--akzent);font-weight:700}
input[type=range]{width:100%;height:34px;accent-color:var(--akzent);cursor:pointer}
.messwert{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px}
.messwert div{background:#0f172a;color:#a5f3fc;border-radius:10px;padding:8px 10px;font-family:var(--mono);font-size:.9rem}
.messwert div small{display:block;color:#94a3b8;font-family:var(--schrift);font-size:.72rem}
.auftraege{list-style:none;padding:0;margin:0;display:grid;gap:6px}
.auftraege li{display:flex;gap:8px;align-items:flex-start;background:#f7f8fc;border:1px solid var(--linie);border-radius:10px;padding:7px 10px;font-size:.92rem}
.auftraege li::before{content:"○";font-weight:900;color:var(--ink3)}
.auftraege li.erledigt{background:var(--ok-hell);border-color:#a9dcb8}
.auftraege li.erledigt::before{content:"✓";color:var(--ok)}
.poe{border:2px solid #c7d2fe;background:#f5f7ff;border-radius:14px;padding:12px 14px}
.poe h4{margin:0 0 6px;color:var(--akzent)}
.modellhinweis{font-size:.8rem;color:var(--ink3);border-left:3px solid var(--linie2);padding-left:10px;margin-top:8px}
.mtab{border-collapse:collapse;font-size:.85rem;width:100%}
.mtab td,.mtab th{border:1px solid var(--linie);padding:4px 6px;text-align:right}
.mtab th{background:#f0f2f8}
svg text{font-family:var(--schrift)}
.ziehpunkt{cursor:grab}
.ziehpunkt:focus{outline:none}
.ziehpunkt:focus circle{stroke:#f59e0b;stroke-width:4}

/* Niveaus / Lernpfad */
.niveau-umschalter{display:inline-flex;background:#e9ecf5;border-radius:14px;padding:4px;gap:4px;flex-wrap:wrap}
.niveau-umschalter button{border:0;background:transparent;border-radius:11px;padding:10px 16px;font:inherit;font-weight:700;cursor:pointer;color:var(--ink2);min-height:44px}
.niveau-umschalter button[aria-pressed="true"]{background:#fff;color:var(--akzent);box-shadow:0 2px 8px rgba(0,0,0,.08)}
.niveau-merkmale{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px;margin:14px 0}
.niveau-merkmale div{background:#fff;border:1px solid var(--linie);border-radius:12px;padding:10px 12px;font-size:.9rem}
.niveau-merkmale b{display:block;color:var(--ink3);font-size:.74rem;text-transform:uppercase;letter-spacing:.05em}
.pfadgraf svg{width:100%;height:auto}
.pfadgraf .knoten rect{fill:#fff;stroke:#c9d0e2;stroke-width:2}
.pfadgraf .knoten.besucht rect{fill:#eef0ff;stroke:#4f46e5}
.pfadgraf .knoten.aktuell rect{fill:#4f46e5;stroke:#4f46e5}
.pfadgraf .knoten.aktuell text{fill:#fff}
.pfadgraf .kante{stroke:#c9d0e2;stroke-width:2;fill:none}
.pfadgraf .kante.genommen{stroke:#4f46e5;stroke-width:3.5}

/* Fortbildung / Präsentation */
.tour{position:fixed;inset:0;z-index:80;background:#0d1328;color:#fff;display:grid;grid-template-rows:auto 1fr auto}
.tour-kopf{display:flex;align-items:center;gap:12px;padding:12px 18px;border-bottom:1px solid rgba(255,255,255,.12)}
.tour-kopf .titel{font-weight:800}
.tour-koerper{overflow:auto;display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:0}
@media (max-width:900px){.tour-koerper{grid-template-columns:1fr}}
.tour-demo{padding:18px;background:#eef1f8;color:var(--ink);overflow:auto}
.tour-notiz{padding:20px;border-left:1px solid rgba(255,255,255,.12);overflow:auto}
.tour-notiz h3{color:#c7d2fe}
.tour-notiz li{margin:.4em 0}
.tour-fuss{display:flex;gap:10px;align-items:center;padding:10px 18px;border-top:1px solid rgba(255,255,255,.12)}
.tour-punkte{display:flex;gap:6px;flex-wrap:wrap;margin:0 auto}
.tour-punkte button{width:12px;height:12px;border-radius:99px;border:0;background:rgba(255,255,255,.3);cursor:pointer;padding:0}
.tour-punkte button.an{background:#a5b4fc;width:28px}
.plan{border-left:4px solid var(--akzent);padding-left:14px}
.plan li{margin:.5em 0}
.zeitbalken{display:flex;height:16px;border-radius:99px;overflow:hidden;margin:8px 0}
.zeitbalken i{display:block;height:100%}

/* Matrix */
.matrix td.j{background:var(--ok-hell);text-align:center;font-weight:800;color:var(--ok)}
.matrix td.p{background:var(--warn-hell);text-align:center;color:var(--warn)}
.matrix td.n{color:#c2c8d8;text-align:center}

/* Fußzeile, Toast */
.fuss{background:#0f1730;color:#b7c0dc;padding:36px 0;margin-top:50px;font-size:.9rem}
.fuss a{color:#c7d2fe}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#16203a;color:#fff;padding:10px 18px;border-radius:12px;box-shadow:var(--schatten2);z-index:90;animation:rein .2s}
.einblenden{animation:rein .35s ease both}
@media print{.kopf,.fuss,.demo-fuss,.knopf{display:none!important}body{background:#fff}}

    { titel: '① Reimschema sichtbar machen', text: 'Markiere in <b>jeder Strophe</b> die Reimwörter am Versende: den ersten Reimklang der Strophe gelb (a), den zweiten blau (b).', engine: 'markieren', cfg: { text: HERBSTTAG, kategorien: ['a – erster Reimklang', 'b – zweiter Reimklang'], soll: [{ p: 'groß.', k: 0 }, { p: 'Sonnenuhren,', k: 1 }, { p: 'los.', k: 0 }, { p: 'sein;', k: 0 }, { p: 'Tage,', k: 1 }, { p: 'jage', k: 1 }, { p: 'Wein.', k: 0 }, { p: 'mehr.', k: 0 }, { p: 'bleiben,', k: 1 }, { p: 'schreiben', k: 1 }, { p: 'her', k: 0 }, { p: 'treiben.', k: 1 }], erkl: 'Strophe 1: aba · Strophe 2: abba · Strophe 3: abbab – die Strophen werden länger.' } },
    { titel: '② Form deuten', engine: 'mc', cfg: { fragen: [
      { f: 'Welches Reimschema hat die zweite Strophe?', o: [{ t: 'umarmender Reim (abba)', r: true }, { t: 'Kreuzreim (abab)', fb: 'Beim Kreuzreim wechseln sich die Reime ab.' }, { t: 'Paarreim (aabb)', fb: 'Beim Paarreim folgen gleiche Reime direkt aufeinander.' }] },
      { f: 'Die Strophen werden von 3 über 4 auf 5 Verse länger. Welche Deutung ist am Text <b>gut begründbar</b>?', o: [{ t: 'Die wachsende Länge passt zur Fülle des Herbstes und zum nicht endenden „Wandern“ am Schluss.', r: true, fb: 'Eine begründete Deutung, die Form und Inhalt verbindet.' }, { t: 'Rilke hat sich verzählt.', fb: 'Formabweichungen in Gedichten sind meist bewusst gestaltet.' }, { t: 'Die Länge hat mit dem Inhalt nichts zu tun.', fb: 'Möglich – aber dann bleibt eine auffällige Form unerklärt.' }] }] } }] },
  did: { ziel: 'Reimschema als formales Mittel erkennen und mit dem Inhalt in Beziehung setzen.', kompetenzen: 'Lesen – literarische Texte analysieren; Fachbegriffe.', prozesse: 'Formanalyse als Ausgangspunkt der Deutung.', mehrwert: 'Farbige Markierung macht das Reimschema auf einen Blick sichtbar; Abgleich mit einer Expertenlösung.', grenzen: 'Die Deutungsfrage bietet nur eine Auswahl – die eigene schriftliche Deutung bleibt das Ziel. Weiterführend: Deutschlabor Herbstlyrik der Schule (Metrum, Vortrag).' } });
LL.demo({ id: 'd-schreiben', titel: 'Schreibtrainer: begründete Stellungnahme', emo: '✍️', fach: ['deutsch'], formate: ['freies_schreiben', 'schreibgeruest', 'selbsteinschaetzung', 'gestufte_hilfen'], engine: 'schreibwerkstatt', phasen: ['transfer', 'ha'], niveau: 'Jg. 7–9',
  cfg: { aufgabe: 'Schreibe eine begründete Stellungnahme (ca. 120–200 Wörter) zur Frage: <i>Sollte an unserer Schule ein Tag pro Monat ohne Hausaufgaben eingeführt werden?</i>', geruest: ['Ich bin der Meinung, dass …', 'Ein wichtiges Argument ist, dass …', 'Zum Beispiel …', 'Zwar …, aber …', 'Zusammenfassend …'],
    hilfen: ['Plane zuerst: Was ist deine Meinung? Notiere zwei Gründe.', 'Aufbau: Einleitung mit Meinung → Argument 1 mit Beispiel → Argument 2 mit Beispiel → Gegenargument entkräften → Schluss.', 'Verknüpfe mit Konnektoren: weil, denn, deshalb, außerdem, zwar … aber, einerseits … andererseits.'],
    indikatoren: [{ n: 'Verknüpfungswörter', muster: '\\b(weil|denn|deshalb|daher|außerdem|zudem|jedoch|allerdings|zwar|einerseits|andererseits)\\b', ziel: 4 }, { n: 'Beispiele', muster: 'zum Beispiel|z\\. ?B\\.|beispielsweise', ziel: 1 }, { n: 'Gegenargument-Signal', muster: '\\b(zwar|allerdings|jedoch|andererseits|Kritiker|Gegner)\\b', ziel: 1 }],
    kriterien: ['Meine Meinung ist am Anfang klar erkennbar.', 'Ich nenne mindestens zwei Argumente mit Begründung.', 'Ich stütze meine Argumente mit Beispielen.', 'Ich gehe auf ein Gegenargument ein.', 'Mein Schluss fasst meine Position zusammen.'],
    minWoerter: 80, beispiel: 'Ich bin der Meinung, dass ein hausaufgabenfreier Tag pro Monat sinnvoll wäre. Ein wichtiges Argument ist, dass viele Schülerinnen und Schüler am Nachmittag Vereine, Musikunterricht oder Familienpflichten haben. Ein freier Tag würde zum Beispiel Zeit für ein Turnier oder ein Familienfest schaffen, ohne dass man abends noch Aufgaben erledigen muss. Außerdem könnte der Tag zum Ausruhen genutzt werden, denn Erholung ist wichtig für das Lernen. Zwar befürchten manche, dass dann Übungszeit fehlt. Allerdings handelt es sich nur um einen Tag im Monat, den Lehrkräfte bei der Planung berücksichtigen können. Zusammenfassend überwiegen für mich die Vorteile: Ein solcher Tag entlastet, ohne das Lernen ernsthaft zu gefährden.' },
  did: { ziel: 'Eine begründete Stellungnahme planen, schreiben und kriteriengeleitet überarbeiten.', kompetenzen: 'Schreiben (argumentieren); Reflexion über eigene Texte.', prozesse: 'Planen – formulieren – überprüfen – überarbeiten (Schreibprozess).', mehrwert: 'Hilfen in drei Stufen, Satzanfänge zum Antippen, transparente Formal-Zähler, Feedforward aus der Selbsteinschätzung; der Beispieltext wird erst nach eigener Leistung freigegeben.', diff: 'Unsichere nutzen alle Hilfen; Sichere verzichten bewusst darauf (Expertise-Umkehr).', grenzen: 'Die Seite bewertet nicht, ob die Argumente überzeugen – das bleibt Aufgabe von Menschen (Schreibkonferenz, Lehrkraft).' } });
LL.demo({ id: 'd-ueberarbeiten', titel: 'Überarbeitungswerkstatt: Ausflug in den Zoo', emo: '🛠', fach: ['deutsch'], formate: ['ueberarbeiten', 'fehlerfinden'], engine: 'ueberarbeiten', phasen: ['uebung'], niveau: 'Jg. 5/6',
  cfg: { text: 'Am Samstag sind wir in den Zoo gefahren. Dann haben wir zuerst die Affen angeschaut. Dann sind wir zu den Löwen gegangen. Die Löwen haben geschlafen, das war langweilig. Dann haben wir ein Eis gegessen. Das Eis war sehr lecker. Dann sind wir zu den Pinguinen gegangen. Die Pinguine sind lustig gewatschelt. Am ende sind wir müde nach hause gefahren. Es war ein toller tag.',
    pruefpunkte: [
      { n: 'Satzanfang „Dann“ höchstens einmal', muster: '(^|[.!?]\\s+)Dann\\b', max: 1, hinweis: 'Viele Sätze beginnen mit „Dann“. Abwechslung: Danach, Anschließend, Später, Zum Schluss …' },
      { n: '„gegangen“ höchstens einmal', muster: 'gegangen', max: 1, hinweis: 'Ersetze „gegangen“ einmal, z. B. durch „gelaufen“ oder „weitergezogen“.' },
      { n: '„Am Ende“ – Nomen groß', muster: 'Am ende', max: 0, hinweis: '„Ende“ ist hier ein Nomen.' },
      { n: '„nach Hause“ – Nomen groß', muster: 'nach hause', max: 0, hinweis: '„Hause“ wird großgeschrieben.' },
      { n: '„Tag“ – Nomen groß', muster: 'toller tag', max: 0, hinweis: 'Nomen werden großgeschrieben.' },
      { n: 'Mindestens eine Begründung mit „weil“ oder „denn“', muster: '\\b(weil|denn)\\b', min: 1, hinweis: 'Begründe eine Wertung, z. B. warum die Pinguine lustig waren.' }],
    erkl: 'Lies den Text jetzt noch einmal laut: Klingt er abwechslungsreicher?' },
  did: { ziel: 'Eigene und fremde Texte gezielt überarbeiten (Satzanfänge, Wortwahl, Rechtschreibung, Begründung).', kompetenzen: 'Schreiben (überarbeiten); Rechtschreibung.', mehrwert: 'Die Liste reagiert live und zeigt, was schon erledigt ist – ohne vorzutäuschen, Stil bewerten zu können.', grenzen: 'Die Prüfpunkte erkennen nur genau diese Muster.' } });
LL.demo({ id: 'd-feedback', titel: 'Schreibkonferenz-Training: Was ist gutes Feedback?', emo: '💬', fach: ['deutsch'], formate: ['schreibkonferenz', 'feedback_training', 'kategorisieren'], engine: 'sortieren', phasen: ['kooperation'], niveau: 'Jg. 5–10', status: 'proto',
  auftrag: 'Ein Mitschüler hat einen Leserbrief geschrieben. Sortiere die Rückmeldungen.',

    { t: 'Dein Einstieg macht neugierig, weil du mit einer Frage beginnst.', k: 0 }, { t: 'Im zweiten Absatz fehlt ein Beispiel für dein Argument mit der Busverbindung.', k: 0 }, { t: 'Ich würde den letzten Satz kürzen – er wiederholt fast wörtlich die Einleitung.', k: 0 },
    { t: 'Ist gut.', k: 1, fb: 'Freundlich, aber ohne Information, was genau gut ist.' }, { t: 'Irgendwas fehlt noch.', k: 1, fb: 'Was genau fehlt? So kann niemand überarbeiten.' }, { t: 'Schöner Text!', k: 1 },

    erkl: 'Gutes Feedback ist konkret, bezieht sich auf den Text (nicht auf die Person) und zeigt einen nächsten Schritt.' },
  did: { ziel: 'Kriterien für hilfreiches Feedback kennen und anwenden.', kompetenzen: 'Sprechen und Zuhören; Schreiben (Überarbeitung im Austausch).', mehrwert: 'Bereitet echte Schreibkonferenzen vor; die Qualität von Rückmeldungen wird selbst zum Lerngegenstand.', grenzen: 'Prototyp: ersetzt nicht die Konferenz am echten Text.' } });

LL.demo({ id: 'e-reading', titel: 'Reading for evidence: A new school', emo: '🔎', fach: ['englisch'], formate: ['belegen', 'markieren', 'textverstaendnis'], engine: 'markieren', phasen: ['erarbeitung', 'pruefung'], niveau: 'Jg. 7/8',
  auftrag: 'Claim: <b>“Maya enjoys her new school.”</b> Mark the sentences that support the claim (yellow) and those that speak against it (blue).',
  cfg: { einheit: 'satz', text: 'Maya moved to Leeds in September. On her first day, she could not find the science lab and arrived late. Her classmates laughed, and she wanted to go home. Two weeks later, a girl called Priya asked her to join the school’s climbing club. Now Maya looks forward to Wednesdays more than to any other day. She still finds the uniform uncomfortable. But when her mum asks about school, Maya talks for an hour. “I didn’t expect to like it here,” she says, “but I really do.”', kategorien: ['supports the claim', 'speaks against the claim'],
    soll: [{ p: 'Now Maya looks forward to Wednesdays', k: 0 }, { p: 'Maya talks for an hour', k: 0 }, { p: 'but I really do', k: 0 }, { p: 'she wanted to go home', k: 1, fb: 'At the beginning – the situation changes later.' }, { p: 'She still finds the uniform uncomfortable', k: 1, fb: 'A detail against it, but a small one.' }],
    erkl: 'Good readers weigh evidence: Overall, the text supports the claim – although some details point the other way.' },
  did: { ziel: 'Aussagen an Textstellen belegen und Belege gewichten.', kompetenzen: 'Leseverstehen (detailliert, schlussfolgernd).', mehrwert: 'Belege werden am Text markiert und mit der Expertenlösung verglichen; Gegenbelege sind ausdrücklich vorgesehen.', diff: 'Schwächere erhalten den Hinweis, dass es drei stützende Sätze gibt.' } });
LL.demo({ id: 'e-vocab', titel: 'Vocabulary in context: do, make, take, have', emo: '🧩', fach: ['englisch'], formate: ['wortschatz_kontext', 'lueckentext'], engine: 'lueckentext', phasen: ['uebung'], niveau: 'Jg. 6–8',
  cfg: { text: 'Before the test, I need to {{*do|make|take}} my homework. Can you {{*take|make|do}} a photo of us? We {{*had|made|did}} a great time at the party. Please {{*pay|give|make}} attention to the instructions. She {{*made|did|took}} a mistake in the last exercise. Let’s {{*take|make|do}} a break.', erkl: 'Collocations: do homework · take a photo · have a great time · pay attention · make a mistake · take a break.', hilfen: ['“make” often means creating something new – but there are fixed phrases.', 'Fixed phrases (collocations) have to be learnt as a whole: <i>make a mistake</i>, but <i>do your homework</i>.'] },
  did: { ziel: 'Feste Wortverbindungen im Satzkontext anwenden.', kompetenzen: 'Verfügen über sprachliche Mittel: Wortschatz.', mehrwert: 'Lernen in Kontexten statt Wortgleichungen; Lösung erst nach zwei Versuchen.' } });

LL.demo({ id: 'e-dialog', titel: 'Dialogue builder: Booking a hotel room', emo: '☎️', fach: ['englisch'], formate: ['dialog'], engine: 'dialog', phasen: ['uebung'], niveau: 'Jg. 8–10',
  cfg: { sprache: 'en-GB', partner: 'Receptionist', ziel: 'Book a hotel room in London on the phone – stay polite and formal.', start: 'a', schritte: {
    a: { sie: 'Good morning, Park Hotel. How can I help you?', wahl: [{ t: 'Good morning. I would like to book a room for two nights, please.', ziel: 'b', fb: 'Polite and clear.' }, { t: 'Hey, gimme a room.', ok: false, fb: 'Too informal for a hotel – use “I would like …, please”.' }, { t: 'Room. Two nights.', ok: false, fb: 'Understandable, but it sounds rude. Use a full sentence.' }] },
    b: { sie: 'Certainly. For which dates?', wahl: [{ t: 'From the 14th to the 16th of May.', ziel: 'c' }, { t: 'Whenever, mate.', ok: false, fb: '“mate” is very informal – and the receptionist needs exact dates.' }] },
    c: { sie: 'A double room is £120 per night, breakfast included. Would that be all right?', wahl: [{ t: 'Yes, that sounds good. Could I pay by card?', ziel: 'd', fb: '“Could I …?” is a polite way to ask.' }, { t: 'That’s a bit more than I expected. Do you have anything cheaper?', ziel: 'c2', fb: 'A polite way to negotiate.' }, { t: 'That’s way too expensive, are you kidding?', ok: false, fb: 'Honest, but rude. Try: “That’s a bit more than I expected …”' }] },
    c2: { sie: 'We also have a single room for £85 per night.', wahl: [{ t: 'That would be perfect. Could I pay by card?', ziel: 'd' }] },
    d: { sie: 'Of course. May I have your name, please?', wahl: [{ t: 'Yes, it’s Alex Miller. Thank you very much for your help.', ziel: 'e' }, { t: 'Why do you need that?', ok: false, fb: 'Hotels need your name for the booking.' }] },
    e: { sie: 'Thank you. Your booking is confirmed. We look forward to seeing you!', ende: 'You managed a formal phone call.' } } },
  did: { ziel: 'Ein formelles Telefonat angemessen führen (Register, Höflichkeitsformen).', kompetenzen: 'Sprechen – an Gesprächen teilnehmen; Sprachbewusstheit (Register).', mehrwert: 'Unpassende Antworten führen nicht ins Leere, sondern erhalten eine erklärende Rückmeldung; Sprachausgabe für das Gegenüber.', grenzen: 'Auswahl statt freier Rede – anschließend als Rollenspiel frei sprechen.' } });
LL.demo({ id: 'e-listening', titel: 'Listening: Sam at the animal shelter', emo: '🎧', fach: ['englisch'], formate: ['hoeren', 'textverstaendnis'], engine: 'hoeren', phasen: ['uebung', 'ha'], niveau: 'Jg. 6/7',
  cfg: { sprache: 'en-GB', text: 'Hi, I’m Sam. Every Saturday I help at an animal shelter near my town. In the morning, I feed the dogs and clean the cages. It’s hard work, but I love it. Last week a family adopted Buddy, a brown dog who had lived at the shelter for almost a year. I was happy for him, but also a little sad. Next summer I want to do an internship at a vet’s practice.',
    fragen: [{ f: 'Where does Sam help on Saturdays?', o: ['at an animal shelter', 'at a vet’s practice', 'at a pet shop'], r: 0 }, { f: 'What does Sam do in the morning?', o: ['feed the dogs and clean the cages', 'walk the dogs in the park', 'answer the phone'], r: 0 }, { f: 'How did Sam feel when Buddy was adopted?', o: ['happy, but also a little sad', 'only sad', 'angry'], r: 0 }, { f: 'What does Sam want to do next summer?', o: ['an internship at a vet’s practice', 'a holiday with Buddy', 'work at the shelter every day'], r: 0 }] },
  did: { ziel: 'Hörtext global und im Detail verstehen.', kompetenzen: 'Hör- und Hörsehverstehen.', mehrwert: 'Tempo wählbar, beliebig oft hörbar; Mitschrift als Hilfe erst danach.', grenzen: 'Computerstimme statt authentischer Sprecherinnen und Sprecher; Qualität hängt vom Gerät ab.' } });
LL.demo({ id: 'e-intercultural', titel: 'Intercultural scenario: “Tea at six”', emo: '🫖', fach: ['englisch'], formate: ['szenario', 'perspektivwechsel'], engine: 'szenario', phasen: ['einstieg', 'transfer'], niveau: 'Jg. 7–9',
  cfg: { hinweis: 'Interkulturelles Szenario: Gewohnheiten unterscheiden sich von Region zu Region und von Familie zu Familie – es geht um Strategien, nicht um Klischees.', start: 'start', knoten: {
    start: { bild: '🏡', t: 'You are on an exchange in Manchester. Your partner’s mum says: <i>“We’re having tea at six – see you then!”</i>', frage: 'What do you do?', wahl: [{ t: 'Eat a big sandwich at five – “tea” probably means a cup of tea and a biscuit.', ziel: 'satt' }, { t: 'Ask your partner: “What do you mean by tea?”', ziel: 'gefragt' }, { t: 'Arrive at six, hungry.', ziel: 'hungrig' }] },
    satt: { bild: '🥧', t: 'At six there is a full meal: shepherd’s pie and vegetables. You are not hungry at all … In many parts of Britain, especially in the north, “tea” can mean the evening meal.', wahl: [{ t: 'Eat a little and explain politely that you had a snack earlier.', ziel: 'ende1' }, { t: 'Say nothing and leave most of the food.', ziel: 'ende2' }] },
    gefragt: { bild: '😄', t: 'Your partner laughs: “Tea is dinner here!” Asking was a good idea – words can mean different things in different regions.', wahl: [{ t: 'Go to dinner at six.', ziel: 'ende1' }] },
    hungrig: { bild: '🍽', t: 'Lucky you – in this family “tea” is the evening meal. Shepherd’s pie!', wahl: [{ t: 'Enjoy the meal.', ziel: 'ende1' }] },
    ende1: { bild: '👍', t: 'Dinner went well.', fazit: 'Useful phrases: <i>“That was delicious, thank you.”</i> – <i>“I’m full, but thank you!”</i> – <i>“Sorry, what do you mean by …?”</i>' },
    ende2: { bild: '🤔', t: 'Your hosts look a bit worried.', fazit: 'They might think you didn’t like the food. A short explanation avoids misunderstandings: <i>“I’m sorry, I had a snack earlier – it’s really tasty.”</i>' } },
    perspektiven: [{ n: '🗣 Sprache', t: 'Wörter haben regionale Bedeutungen („tea“, „dinner“, „supper“). Nachfragen ist eine Stärke.' }, { n: '🏠 Gastfamilie', t: 'Gastgeber freuen sich über Rückmeldung; Schweigen kann als Ablehnung verstanden werden.' }, { n: '🪞 Ich selbst', t: 'Welche Wörter oder Gewohnheiten aus deiner Familie könnten Gäste missverstehen?' }],
    reflexion: 'Which phrases would you use next time? (English or German)' },
  did: { ziel: 'Interkulturelle Missverständnisse erkennen und sprachliche Strategien entwickeln.', kompetenzen: 'Interkulturelle kommunikative Kompetenz.', mehrwert: 'Verschiedene Wege lassen sich vergleichen; Konsequenzen werden erlebbar, ohne peinlich zu sein.', grenzen: 'Gefahr der Verallgemeinerung – ausdrücklich thematisieren.' } });
LL.demo({ id: 'e-mediation', titel: 'Mediation: The school trip', emo: '🔁', fach: ['englisch'], formate: ['sprachmittlung', 'mehrstufig', 'markieren'], engine: 'kette', phasen: ['transfer', 'pruefung'], niveau: 'Jg. 8–10',
  cfg: { schritte: [
    { titel: '① Was braucht Sam?', text: 'Sam, dein Austauschpartner aus Leeds, fährt mit. Er versteht kein Deutsch. Markiere, was für ihn wichtig ist – und was nicht.', engine: 'markieren', cfg: { einheit: 'satz', text: 'Liebe Eltern, am Freitag fährt die Klasse 8b in den Zoo nach Münster. Treffpunkt ist um 7:45 Uhr am Busparkplatz der Schule. Bitte denken Sie an wetterfeste Kleidung und ein Lunchpaket. Der Eintritt (12 €) wird vor Ort bezahlt. Die Busfirma wurde 1985 gegründet und hat moderne Busse. Die Rückkehr ist gegen 16 Uhr geplant.', kategorien: ['wichtig für Sam', 'unwichtig für Sam'], soll: [{ p: 'Treffpunkt ist um 7:45 Uhr', k: 0 }, { p: 'wetterfeste Kleidung und ein Lunchpaket', k: 0 }, { p: 'Der Eintritt (12 €)', k: 0 }, { p: 'Die Rückkehr ist gegen 16 Uhr', k: 0 }, { p: 'Die Busfirma wurde 1985 gegründet', k: 1 }] } },
    { titel: '② Write a message to Sam', engine: 'schreibwerkstatt', cfg: { aufgabe: 'Write a short, friendly message in English. Pass on only what Sam needs – do not translate word for word.', indikatoren: [{ n: 'meeting time', muster: '7[:.]45|quarter to eight' }, { n: 'clothes / lunch', muster: 'cloth|rain|jacket|lunch|sandwich' }, { n: 'money', muster: 'euro|€|12|money' }, { n: 'return time', muster: '4 ?pm|four|16' }], kriterien: ['I included all information Sam needs.', 'I left out unimportant details.', 'I used simple English, not word-for-word translation.', 'My message is friendly (greeting, ending).'], minWoerter: 30, beispiel: 'Hi Sam! On Friday we’re going to the zoo in Münster. We meet at the school bus car park at 7:45 (quarter to eight!). Bring clothes for any weather and a packed lunch. The ticket costs 12 euros, so bring some money. We’ll be back at about 4 pm. See you, Lena' } }] },
  did: { ziel: 'Informationen adressatengerecht und sinngemäß in die Fremdsprache übertragen.', kompetenzen: 'Sprachmittlung.', prozesse: 'Selektieren (Was braucht die Person?) → Umformulieren → Adressatenbezug.', mehrwert: 'Die Auswahlphase wird sichtbar und überprüfbar – genau dort scheitern viele Sprachmittlungen.', grenzen: 'Die englische Nachricht wird nicht automatisch bewertet.' } });
LL.demo({ id: 'e-writing', titel: 'Argumentative writing (Oberstufe): Tablets instead of textbooks?', emo: '📝', fach: ['englisch'], formate: ['freies_schreiben', 'schreibgeruest'], engine: 'schreibwerkstatt', phasen: ['transfer', 'pruefung'], niveau: 'Oberstufe',

/* Unterrichtsziele, Stundenabläufe, Fortbildungstour, Zukunftsideen, Grenzen digitalen Lernens.
   Enthält außerdem zwei kleine Bausteine für die Stundenabläufe: positionierung und notiz. */
(function () {
  var h = LL.h;
  /* Positionierung mit Vorher-nachher-Vergleich (nur lokal gespeichert) */
  LL.engines.positionierung = function (ziel, cfg) {
    var alt = LL.speicher.lies('pos:' + cfg.schluessel, null), out = h('b'), r = h('input', { type: 'range', min: -3, max: 3, value: alt && cfg.vergleich ? alt : 0, 'aria-label': cfg.aussage });
    var namen = ['stimme gar nicht zu', 'stimme nicht zu', 'eher nicht', 'unentschieden', 'eher ja', 'stimme zu', 'stimme voll zu'];
    function z() { out.textContent = namen[Number(r.value) + 3]; }
    r.addEventListener('input', z); z();
    var rueck = h('div');
    ziel.appendChild(h('div', { class: 'szene', html: '<b>These:</b> „' + cfg.aussage + '“' }));
    ziel.appendChild(h('div', { style: 'margin:12px 0' }, r, h('div', { class: 'knopfreihe klein' }, h('span', null, '◀ dagegen'), h('span', { style: 'margin:0 auto' }, out), h('span', null, 'dafür ▶'))));
    ziel.appendChild(h('textarea', { 'aria-label': 'Begründung', placeholder: 'Ich sehe das so, weil …', style: 'min-height:70px' }));
    ziel.appendChild(h('button', { class: 'knopf', type: 'button', onclick: function () {
      if (cfg.vergleich && alt !== null) { var d = Number(r.value) - alt; LL.fb(rueck, 'info', 'Zu Beginn: „' + namen[alt + 3] + '“ – jetzt: „' + namen[Number(r.value) + 3] + '“. ' + (d ? 'Deine Position hat sich verschoben. Welches Argument hat dich bewegt?' : 'Deine Position ist gleich geblieben. Ist deine Begründung jetzt differenzierter?')); }
      else { LL.speicher.schreib('pos:' + cfg.schluessel, Number(r.value)); LL.fb(rueck, 'ok', 'Position festgehalten (nur in diesem Browser). Am Ende der Stunde vergleichst du.'); }
    } }, cfg.vergleich ? 'Mit dem Stundenbeginn vergleichen' : 'Position festhalten'));
    ziel.appendChild(rueck);
  };
  /* Notiz/Hypothese festhalten */
  LL.engines.notiz = function (ziel, cfg) {
    var ta = h('textarea', { 'aria-label': cfg.frage, placeholder: cfg.anfang || '', style: 'min-height:90px' }); ta.value = LL.speicher.lies('notiz:' + cfg.schluessel, '');
    ta.addEventListener('input', function () { LL.speicher.schreib('notiz:' + cfg.schluessel, ta.value); });
    ziel.appendChild(h('div', { class: 'frage', html: cfg.frage })); ziel.appendChild(ta);
    if (cfg.muster) ziel.appendChild(h('details', { style: 'margin-top:8px' }, h('summary', { style: 'cursor:pointer;font-weight:700;color:var(--akzent)' }, 'Mögliche Antwort anzeigen'), h('div', { class: 'kasten ok', html: cfg.muster })));
    ziel.appendChild(h('p', { class: 'klein' }, '💾 Wird nur in diesem Browser gespeichert.'));
  };
})();
